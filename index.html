<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1118">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>那什么dk萌</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0d1118;}
#legacy{display:block;width:100%;height:100dvh;border:0;background:#0d1118;}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#8b94a8;font:14px/1.6 -apple-system,"PingFang SC",sans-serif;background:#0d1118;z-index:10;transition:opacity .4s;}
#boot.hide{opacity:0;pointer-events:none;}
</style>
</head>
<body>
<iframe id="legacy" allow="autoplay" style="width:100%;height:100%;border:0;background:#0d1118;"></iframe>
<div id="boot">正在加载 V1.1…</div>
<script>
'use strict';
window.proxyFetch = async function(url, opts) {
  const proxies = ["", "https://corsproxy.io/?", "https://api.allorigins.win/raw?url="];
  let lastErr;
  for (const p of proxies) {
    try {
      let fetchUrl = url;
      if (p) fetchUrl = p.includes('?') || p.includes('=') ? p + encodeURIComponent(url) : p + '?url=' + encodeURIComponent(url);
      const res = await fetch(fetchUrl, opts);
      if (!res.ok && p !== "") continue;
      const text = await res.text();
      return { ok: res.ok, status: res.status, json: async () => JSON.parse(text), text: async () => text };
    } catch (e) { lastErr = e; }
  }
  throw lastErr;
};

const frame=document.getElementById('legacy');
frame.src = './legacy.html?v=' + Date.now();
frame.addEventListener('load',()=>{
  try{boot(frame.contentWindow,frame.contentDocument);document.getElementById('boot').classList.add('hide');}
  catch(e){console.error('[启动器] 注入失败：',e);document.getElementById('boot').textContent='注入失败：'+e.message;}
});

function boot(win,doc){
  const ready=()=>typeof win.renderScene==='function';
  const whenReady=(fn)=>{if(ready())return fn();let n=0;const t=setInterval(()=>{if(ready()||++n>100){clearInterval(t);fn();}},100);};

  // ================= 核心修复：强制纠正性别与剪影匹配 =================
  function fixCharacterGenders() {
    if (!win.state || !win.state.characters) return;
    const femaleIds = ['zhongyueru', 'yuanbao', 'miju'];
    const maleIds = ['qinwu', 'luoyunying', 'linyan', 'tangjiawei'];
    
    win.state.characters.forEach(c => {
      if (femaleIds.includes(c.id) || femaleIds.includes(c.name)) c.gender = '女';
      else if (maleIds.includes(c.id) || maleIds.includes(c.name)) c.gender = '男';
      
      if (c.gender === 'female') c.gender = '女';
      if (c.gender === 'male') c.gender = '男';
    });

    // 修复剪影库的性别字段，防止旧数据写成“女”而不是“female”
    if (win.state.silhouettes) {
      win.state.silhouettes.forEach(s => {
        if (s.name.includes('女')) s.gender = 'female';
        if (s.name.includes('男')) s.gender = 'male';
      });
    }
  }

  // 接管原版 findPortrait，绝对禁止女角色拿男剪影
  win.findPortrait = function(speaker, text) {
    if (!speaker || speaker === '旁白') return null;
    const c = win.state.characters.find(c => c.name === speaker);
    if (!c || c.useSprite === false) return null;
    
    let img = null;
    if (c.portraitId) {
      img = win.state.images.find(i => i.id === c.portraitId);
    } else {
      const list = win.state.images.filter(i => i.character === speaker && (i.builtIn || i.enabled !== false));
      if (list.length) {
        const emotion = typeof win.emotionFor === 'function' ? win.emotionFor(text) : '正常';
        img = list.find(i => i.expression === emotion) || list.find(i => i.expression === '正常') || list[0];
      }
    }
    if (img) return { ...img, isSilhouette: false };

    const isFemale = c.gender === '女' || c.gender === 'female' || ['钟月茹','元宝','米桔'].includes(c.name);
    const gender = isFemale ? 'female' : 'male';
    
    let sil = win.state.silhouettes.find(s => s.gender === gender && Array.isArray(s.boundCharacters) && s.boundCharacters.includes(c.id));
    
    // 如果绑定的剪影性别不对，清空绑定
    if (sil && sil.gender !== gender) sil = null;

    if (!sil) {
      const unbound = win.state.silhouettes.filter(s => s.gender === gender && (!Array.isArray(s.boundCharacters) || s.boundCharacters.length === 0));
      if (unbound.length) {
        let sum = 0; for (let i=0;i<c.id.length;i++) sum += c.id.charCodeAt(i);
        sil = unbound[sum % unbound.length];
      }
    }
    
    // 严格校验：如果拿到的剪影性别仍然不对，宁可不显示也不能跨性别
    if (sil && ((gender === 'female' && sil.gender !== 'female') || (gender === 'male' && sil.gender !== 'male'))) {
       sil = null;
    }

    if (sil) return { id: sil.id, url: sil.url, name: sil.name, isSilhouette: true };
    return null;
  };
  // ====================================================================

  function setupObserver(){
    const observer = new MutationObserver(() => {
      const navs = doc.querySelectorAll('.diamond-nav');
      navs.forEach(nav => {
        if (!nav.querySelector('[data-action="open-phone"]')) {
          const wrap = doc.createElement('div');
          wrap.className = 'diamond-wrap';
          wrap.innerHTML = '<button class="diamond" data-action="open-phone" aria-label="打开手机"><span>手机</span></button>';
          nav.insertBefore(wrap, nav.firstChild);
        }
      });
      if (!doc.getElementById('phoneOverlay')) {
        const ov = doc.createElement('div');
        ov.id = 'phoneOverlay';
        ov.hidden = true;
        ov.style.cssText = 'position:fixed;inset:0;z-index:9997;background:#111;display:flex;align-items:center;justify-content:center;';
        ov.innerHTML = '<iframe id="phoneFrame" src="./phone.html?v=10" allow="autoplay" style="width:100%;height:100%;border:0;background:#111;"></iframe>';
        doc.body.appendChild(ov);
      }
    });
    observer.observe(doc.body, { childList: true, subtree: true });
  }

  doc.addEventListener('click', (e) => {
    const targetPhone = e.target.closest('[data-action="open-phone"]');
    if (targetPhone) {
      e.preventDefault();e.stopPropagation();
      doc.getElementById('phoneOverlay').hidden = false;
      const f = doc.getElementById('phoneFrame');
      if (f && f.contentWindow) {
        try {
          const phoneData = getPhoneData();
          const expectedLen = (phoneData.contacts || []).length;
          if (f.dataset.contactsLen !== String(expectedLen)) {
            f.dataset.contactsLen = String(expectedLen);
            try { f.contentWindow.location.reload(); } catch(err) { f.src = './phone.html?v=' + Date.now(); }
            return; 
          }
          const imgs = win.state.images || [];
          (win.state.characters || []).forEach(c => {
            if(!c.portraitUrl) {
              let url = '';
              if(c.portraitId) { const img = imgs.find(i=>i.id===c.portraitId); if(img) url = img.url; }
              if(!url) { const list = imgs.filter(i=>i.character===c.name&&(i.builtIn||i.enabled!==false)); if(list.length) url = list[0].url; }
              c.portraitUrl = url;
            }
          });
          const recentStory = (win.state.story || []).slice(-15).map(s => `${s.speaker}：${s.text}`).join('\n');
          const memoryContext = (win.state.memory && win.state.memory.summaries) ? win.state.memory.summaries.slice(-2).map(m => m.content).join('\n') : '';
          const payload = { characters: win.state.characters, player: win.state.player, api: win.state.api, mvu: win.state.mvu, settings: win.state.settings, recentStory, memoryContext };
          f.contentWindow.eval(`if (window.receiveData) window.receiveData(${JSON.stringify(payload)})`);
        } catch(err) { console.warn('同步失败', err); }
      }
      return;
    }
    const targetNew = e.target.closest('[data-action="new-story"]');
    if (targetNew) {
      e.preventDefault(); e.stopPropagation();
      win.showConfirm('重新开始', '确定要完全重新开始吗？将清空所有进度、手机聊天记录和个人设定。', () => {
        localStorage.removeItem('sft_phone_v1');
        for (let i = localStorage.length - 1; i >= 0; i--) {
          const key = localStorage.key(i);
          if (key && key.startsWith('sft_phone_story_')) localStorage.removeItem(key);
        }
        let storeKey = '';
        try { storeKey = win.eval('typeof STORE === "string" ? STORE : ""'); } catch (err) {}
        if (!storeKey) storeKey = 'yueying-visual-novel-v16';
        localStorage.removeItem(storeKey);
        localStorage.removeItem('yueying-custom-font');
        try { window.top.location.reload(); } catch (err) {
          try { document.getElementById('boot').classList.remove('hide'); frame.src = './legacy.html?v=' + Date.now(); } catch (e2) { location.reload(); }
        }
      });
      return;
    }
  }, true);

  function isStoryMode(){
    try{const raw=localStorage.getItem('sft_phone_v1');if(!raw)return false;return (JSON.parse(raw).mode||'ai')==='story';}catch(e){return false;}
  }
  win.isStoryMode=isStoryMode;window.isStoryMode=isStoryMode;
  function getPhoneData(){try{return JSON.parse(localStorage.getItem('sft_phone_v1'))||{};}catch(e){return{};}}
  function injectScript(src,cb){const s=doc.createElement('script');s.src=src;s.onload=()=>cb&&cb();s.onerror=()=>console.warn('[启动器] 脚本加载失败：',src);doc.body.appendChild(s);}

  function hookScene(){
    const origRenderScene = win.renderScene;
    win.renderScene = function() {
      // 每次渲染前强制修正一次数据
      fixCharacterGenders();
      
      if(win.state && win.state.story && win.state.story.length > 0) {
        const current = win.state.story[win.state.cursor];
        if (current && current.speaker === '秦梧' && current.text.includes('以后有事可以找我呀')) {
          const p = getPhoneData();
          p.contacts = p.contacts || [];
          if (!p.contacts.includes('qinwu')) {
            p.contacts.push('qinwu');
            localStorage.setItem('sft_phone_v1', JSON.stringify(p));
            if (typeof win.toast === 'function') win.toast('【获得秦梧的联系方式】');
            if (!win.state.story.some(s => s.id === 'notify_qinwu_contact')) {
              win.state.story.splice(win.state.cursor + 1, 0, { id: 'notify_qinwu_contact', speaker: '旁白', text: '【获得秦梧的联系方式】' });
              if (typeof win.persist === 'function') win.persist();
            }
          }
        }
      }
      const mapBtn = doc.querySelector('[data-action="open-map"]');
      if(mapBtn) mapBtn.parentElement.style.display = isStoryMode() ? 'none' : '';
      if (isStoryMode() && typeof win.renderStoryScene === 'function') { win.renderStoryScene(); return; }
      return origRenderScene.call(this);
    };
  }

  function buildPhoneContext(){
    try{
      const p=getPhoneData();const chars=win.state.characters||[];const lines=[];lines.push('【手机私聊最近消息】');const chatLines=[];
      for(const cid in (p.chats||{})){
        const c=chars.find(x=>String(x.id)===String(cid));if(!c)continue;
        const list=(p.chats[cid]||[]).filter(m=>m.r!=='sys').slice(-5);if(!list.length)continue;
        chatLines.push(`--- ${c.name} ---`);list.forEach(m=>chatLines.push(`${m.r==='user'?'玩家':c.name}：${m.c}`));
      }
      lines.push(chatLines.join('\n')||'（暂无）');lines.push('\n【朋友圈最近动态】');
      const moLines=(p.moments||[]).slice(0,5).map(m=>`${m.authorName}：${m.text}`);lines.push(moLines.join('\n')||'（暂无）');
      lines.push('\n【角色关系】');const relLines=[];
      for(const idA in (p.relations||{})){
        const cA=chars.find(x=>String(x.id)===String(idA));if(!cA)continue;
        for(const idB in p.relations[idA]){
          const r=p.relations[idA][idB];if(!r.known)continue;
          const cB=chars.find(x=>String(x.id)===String(idB));if(!cB)continue;
          relLines.push(`${cA.name} 与 ${cB.name}：${r.relation||'认识'}`);
        }
      }
      lines.push(relLines.join('\n')||'（暂无）');
      if(p.activeMeetup){ lines.push(`\n【当前约见】${p.activeMeetup.charName} 约在 ${p.activeMeetup.location}（${p.activeMeetup.daysFromNow===0?'今天':p.activeMeetup.daysFromNow+'天后'}）`);}
      return lines.join('\n');
    }catch(e){return '';}
  }

  function parseSpecialMarkers(text){
    const RE=/(?:\[|【)(朋友圈|消息|加好友)[:：\s]*([^\]】]+)(?:\]|】)/g;
    const actions=[];
    const clean=text.replace(RE,(all,type,body)=>{
      const parts=body.split('|').map(s=>s.trim());
      if(parts.length>=1)actions.push({type,parts});
      return '';
    }).trim();
    return {clean,actions};
  }

  function executeMarkerActions(actions){
    const p=getPhoneData();
    const chars=win.state.characters||[];
    for(const act of actions){
      if(act.type==='加好友'){
        const charName=act.parts[0];
        const c=chars.find(x=>x.name===charName);
        if(c){
          p.contacts=p.contacts||[];
          if(!p.contacts.includes(String(c.id))){
            p.contacts.push(String(c.id));
            if(typeof win.toast==='function')win.toast(`（${charName} 加你为好友了）`);
          }
        }
        continue;
      }
      if(act.parts.length<2) continue;
      const [charName,content]=act.parts;
      const c=chars.find(x=>x.name===charName);
      if(!c)continue;

      if(act.type==='朋友圈'){
        p.moments=p.moments||[];
        p.moments.unshift({ id:'m_'+Date.now()+Math.random().toString(36).slice(2,6), authorId:c.id,authorName:charName, authorAvatar:c.portraitUrl||c.a||'', text:content,t:Date.now(),comments:[] });
        if(typeof win.toast==='function')win.toast(`（${charName} 发了条朋友圈）`);
      }
      else if(act.type==='消息'){
        p.chats=p.chats||{};
        p.contacts=p.contacts||[];
        
        if(!p.contacts.includes(String(c.id))){
           p.contacts.push(String(c.id));
           if(typeof win.toast==='function')win.toast(`（${charName} 加你为好友，并给你发了条消息）`);
        } else {
           if(typeof win.toast==='function')win.toast(`（${charName} 给你发了条消息）`);
        }
        
        (p.chats[c.id]=p.chats[c.id]||[]).push({r:'ai',c:content,t:Date.now()});
      }
    }
    localStorage.setItem('sft_phone_v1',JSON.stringify(p));
  }

  function hookAPI(){
    if(typeof win.buildSystem==='function'){
      const origBuild=win.buildSystem;
      win.buildSystem=function(){
        const base=origBuild.call(this);const phoneCtx=buildPhoneContext();let prefix='';
        if(phoneCtx)prefix+=`\n【手机端上下文】\n${phoneCtx}\n`;
        
        prefix += '\n【手机端主动联动（极其重要）】\n';
        prefix += '你不仅是在生成文字剧情，你还在操控角色们的“手机系统”。如果发生了特殊事件、角色内心产生波动、或者线下见面结束后，请务必使用以下指令让角色主动发手机动态（这些指令绝对不要在正文中显示）：\n';
        prefix += '[朋友圈:角色名|内容] 表示该角色刚刚发了一条朋友圈。请在合适的时机使用，内容要符合人设。\n';
        prefix += '[消息:角色名|内容] 表示该角色刚刚私聊给你发了一条消息。\n';
        prefix += '[加好友:角色名] 表示该角色同意了你的好友请求。\n';
        prefix += '【警告】必须严格使用半角英文方括号 `[]` 和半角冒号 `:`，不要使用【】。如果你想让一个还不是好友的角色发消息，必须先输出 [加好友:角色名] 或者直接使用 [消息:...] （系统会自动帮你加为好友）。\n';
        
        if(win.state.settings.enableMVU&&typeof win.mvuBuildPrompt==='function')return win.mvuBuildPrompt()+prefix+base;
        return prefix+base;
      };
    }
    if(typeof win.callChat==='function'){
      const origChat=win.callChat;
      win.callChat=async function(messages){
        const reply=await origChat.call(this,messages);let out=reply;
        if(win.state.settings.enableMVU&&typeof win.mvuParseFromReply==='function'&&typeof win.mvuApplyPatch==='function'){
          try{const patches=win.mvuParseFromReply(out);if(patches&&patches.length)win.mvuApplyPatch(patches);if(typeof win.mvuStripVariableBlocks==='function')out=win.mvuStripVariableBlocks(out);}catch(e){}
        }
        const {clean,actions}=parseSpecialMarkers(out);
        if(actions.length)executeMarkerActions(actions);
        return clean;
      };
    }
  }

  function injectMVUToggle(){
    const status=doc.getElementById('apiStatus');if(!status||doc.getElementById('mvuToggleRow'))return;
    const actionsDiv=status.parentElement;if(!actionsDiv||!actionsDiv.parentNode)return;
    const checked=win.state.settings.enableMVU?'checked':'';
    const row=doc.createElement('div');row.id='mvuToggleRow';row.className='switch-row';row.style.marginTop='8px';
    row.innerHTML='<div class="switch-copy"><strong>启用 MVU 变量同步</strong><small>开启后生成剧情会附带当前世界变量</small></div><label class="switch"><input type="checkbox" id="mvuCheckbox" '+checked+'><span class="switch-ui"></span></label>';
    actionsDiv.parentNode.insertBefore(row,actionsDiv);
    doc.getElementById('mvuCheckbox').addEventListener('change',function(e){win.state.settings.enableMVU=e.target.checked;win.persist();});
  }

  win.parent.startStoryById=function(storyId){ if(typeof win.startStoryById==='function')win.startStoryById(storyId); };
  win.parent.closePhoneOverlay=function(){const ov=doc.getElementById('phoneOverlay');if(ov)ov.hidden=true;};
  win.parent.renderMainScene=function(){if(typeof win.renderScene==='function')win.renderScene();};
  win.parent.onMeetupAccepted=function(meetup){ if(typeof win.toast==='function')win.toast(`约见已确认：${meetup.location}`); };
  win.parent.onMeetupCancelled=function(){ if(typeof win.toast==='function')win.toast('约见已取消'); };

  whenReady(()=>{
    setupObserver();hookScene();hookAPI();
    const origRenderPanel=win.renderPanel;
    win.renderPanel=function(){origRenderPanel.call(this);setTimeout(injectMVUToggle,20);};
    injectScript('./story-engine.js');injectScript('./js/mvu.js');
  });
}
</script>
</body>
</html>
