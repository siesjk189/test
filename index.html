<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1118">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>那什么dk萌</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0d1118;}
#legacy{display:block;width:100%;height:100dvh;border:0;background:#0d1118;}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#8b94a8;font:14px/1.6 -apple-system,"PingFang SC",sans-serif;background:#0d1118;z-index:10;transition:opacity .4s;}
#boot.hide{opacity:0;pointer-events:none;}
</style>
</head>
<body>
<iframe id="legacy" allow="autoplay" style="width:100%;height:100%;border:0;background:#0d1118;"></iframe>
<div id="boot">正在加载 V1.2 稳定版…</div>
<script>
'use strict';
const frame=document.getElementById('legacy');
frame.src = './legacy.html?v=' + Date.now();

frame.addEventListener('load',()=>{
  try{boot(frame.contentWindow,frame.contentDocument);document.getElementById('boot').classList.add('hide');}
  catch(e){console.error('[启动器] 注入失败：',e);document.getElementById('boot').textContent='注入失败：'+e.message;}
});

function boot(win,doc){
  const ready=()=>typeof win.renderScene==='function';
  const whenReady=(fn)=>{
    if(ready())return fn();
    let n=0;
    const t=setInterval(()=>{if(ready()||++n>100){clearInterval(t);fn();}},100);
  };

  // 1. 使用 MutationObserver 监听右上角按钮区域，只要出现就插入手机按钮
  function setupObserver(){
    const observer = new MutationObserver(() => {
      // 遍历所有 .diamond-nav（包含场景内和大地图内的导航条），保证每个界面都有手机按钮
      const navs = doc.querySelectorAll('.diamond-nav');
      navs.forEach(nav => {
        if (!nav.querySelector('[data-action="open-phone"]')) {
          const wrap = doc.createElement('div');
          wrap.className = 'diamond-wrap';
          wrap.innerHTML = '<button class="diamond" data-action="open-phone" aria-label="打开手机"><span>手机</span></button>';
          nav.insertBefore(wrap, nav.firstChild);
        }
      });
      
      // 保证 iframe 覆盖层存在
      if (!doc.getElementById('phoneOverlay')) {
        const ov = doc.createElement('div');
        ov.id = 'phoneOverlay';
        ov.hidden = true;
        ov.style.cssText = 'position:fixed;inset:0;z-index:9997;background:#111;display:flex;align-items:center;justify-content:center;';
        ov.innerHTML = '<iframe id="phoneFrame" src="./phone.html?v=10" allow="autoplay" style="width:100%;height:100%;border:0;background:#111;"></iframe>';
        doc.body.appendChild(ov);
      }
    });
    observer.observe(doc.body, { childList: true, subtree: true });
  }

  // 2. 拦截点击事件
  doc.addEventListener('click', (e) => {
    // 拦截“手机”按钮
    const targetPhone = e.target.closest('[data-action="open-phone"]');
    if (targetPhone) {
      e.preventDefault();e.stopPropagation();
      doc.getElementById('phoneOverlay').hidden = false;
      const f = doc.getElementById('phoneFrame');
      if (f && f.contentWindow) {
        try {
          const phoneData = getPhoneData();
          const expectedLen = (phoneData.contacts || []).length;
          
          // 发现联系人数量发生变化，强制重载 iframe 读取最新本地数据
          if (f.dataset.contactsLen !== String(expectedLen)) {
            f.dataset.contactsLen = String(expectedLen);
            try { f.contentWindow.location.reload(); } catch(err) { f.src = './phone.html?v=' + Date.now(); }
            return; 
          }

          // 如果数量没变，正常同步活跃状态
          const imgs = win.state.images || [];
          (win.state.characters || []).forEach(c => {
            if(!c.portraitUrl) {
              let url = '';
              if(c.portraitId) { const img = imgs.find(i=>i.id===c.portraitId); if(img) url = img.url; }
              if(!url) { const list = imgs.filter(i=>i.character===c.name&&(i.builtIn||i.enabled!==false)); if(list.length) url = list[0].url; }
              c.portraitUrl = url;
            }
          });
          
          const payload = { 
            characters: win.state.characters, 
            player: win.state.player, 
            api: win.state.api, 
            mvu: win.state.mvu, 
            settings: win.state.settings,
            contacts: phoneData.contacts || [],
            chats: phoneData.chats || {},
            moments: phoneData.moments || [],
            relations: phoneData.relations || {},
            activeMeetup: phoneData.activeMeetup || null
          };
          
          // 注入脚本：同步数据 + 添加手机端自定义设置功能
          const jsCode = `
            try {
              if (window.receiveData) window.receiveData(${JSON.stringify(payload)});
              const p = JSON.parse(localStorage.getItem('sft_phone_v1') || '{}');
              if (window.state) {
                window.state.contacts = p.contacts || [];
                window.state.chats = p.chats || {};
                window.state.moments = p.moments || [];
              }
              if (typeof window.renderChatList === 'function') window.renderChatList();
              else if (typeof window.renderContacts === 'function') window.renderContacts();
              else if (typeof window.render === 'function') window.render();
              else if (typeof window.refresh === 'function') window.refresh();
              else if (typeof window.updateUI === 'function') window.updateUI();

              // --- 新增：注入单角色聊天自定义设置 ---
              if (!window.__cp_injected) {
                window.__cp_injected = true;
                
                // 注入样式
                const injectStyle = document.createElement('style');
                injectStyle.innerHTML = '.cp-settings-btn { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; background: rgba(0,0,0,0.1); color: #333; font-size: 14px; cursor: pointer; margin-left: 8px; } ' +
                  '.cp-settings-modal { position: fixed; inset: 0; z-index: 99999; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; font-family: sans-serif; } ' +
                  '.cp-settings-content { background: #fff; border-radius: 12px; padding: 20px; width: 85%; max-width: 320px; color: #333; } ' +
                  '.cp-settings-content h3 { margin: 0 0 15px; font-size: 16px; text-align: center; } ' +
                  '.cp-settings-content label { display: block; margin: 10px 0 5px; font-size: 13px; color: #666; } ' +
                  '.cp-settings-content input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; } ' +
                  '.cp-settings-actions { display: flex; gap: 10px; margin-top: 20px; } ' +
                  '.cp-settings-actions button { flex: 1; padding: 10px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; } ' +
                  '.cp-settings-actions .cp-save { background: #007bff; color: #fff; } ' +
                  '.cp-settings-actions .cp-cancel { background: #eee; color: #333; }';
                document.head.appendChild(injectStyle);

                // 获取当前聊天角色 ID
                window.getCurrentCharId = function() {
                  const p = JSON.parse(localStorage.getItem('sft_phone_v1') || '{}');
                  if (window.activeContactId) return window.activeContactId;
                  if (window.activeContact) return window.activeContact.id || window.activeContact;
                  if (location.hash && location.hash.startsWith('#chat/')) return location.hash.split('/')[1];
                  const chars = p.characters || [];
                  const header = document.querySelector('.chat-header') || document.querySelector('.header') || document.querySelector('.top-bar');
                  if (header) {
                    const text = header.textContent.trim();
                    const found = chars.find(c => text.includes(c.name));
                    if (found) return found.id;
                  }
                  return null;
                };

                // 应用自定义设置
                window.applyCpSettings = function() {
                  const charId = window.getCurrentCharId();
                  if (!charId) return;
                  const p = JSON.parse(localStorage.getItem('sft_phone_v1') || '{}');
                  const settings = (p.chatSettings || {})[charId] || {};
                  
                  let bgStyle = document.getElementById('cp-custom-bg-style');
                  if (bgStyle) bgStyle.remove();
                  
                  // 如果角色有单独设置背景，覆盖背景样式
                  if (settings.bg) {
                    bgStyle = document.createElement('style');
                    bgStyle.id = 'cp-custom-bg-style';
                    bgStyle.innerHTML = "body, #app, .phone-container, .chat-bg { background-image: url(" + settings.bg + ") !important; background-size: cover !important; background-position: center !important; background-color: transparent !important; } .message-list, .chat-container { background: transparent !important; }";
                    document.head.appendChild(bgStyle);
                  }
                  
                  // 如果角色有单独设置头像，修改相关 img
                  if (settings.avatar) {
                    const header = document.querySelector('.chat-header') || document.querySelector('.header') || document.querySelector('.top-bar');
                    if (header) {
                      const imgs = header.querySelectorAll('img');
                      for (let i=0; i<imgs.length; i++) imgs[i].src = settings.avatar;
                    }
                    const msgImgs = document.querySelectorAll('.message-list img');
                    for (let i=0; i<msgImgs.length; i++) msgImgs[i].src = settings.avatar;
                  }
                };

                // 弹窗
                window.openCpSettings = function(charId) {
                  const p = JSON.parse(localStorage.getItem('sft_phone_v1') || '{}');
                  const chars = p.characters || [];
                  const char = chars.find(c => String(c.id) === String(charId)) || { name: '未知角色' };
                  const chatSettings = p.chatSettings || {};
                  const current = chatSettings[charId] || { avatar: '', bg: '' };
                  
                  const modal = document.createElement('div');
                  modal.className = 'cp-settings-modal';
                  modal.innerHTML = '<div class="cp-settings-content">' +
                    '<h3>设置：' + char.name + '</h3>' +
                    '<label>自定义头像 URL (留空恢复默认)</label>' +
                    '<input type="text" id="cp-input-avatar" value="' + (current.avatar || '') + '" placeholder="https://...">' +
                    '<label>自定义聊天背景 URL (留空使用手机全局背景)</label>' +
                    '<input type="text" id="cp-input-bg" value="' + (current.bg || '') + '" placeholder="https://...">' +
                    '<div class="cp-settings-actions">' +
                      '<button class="cp-cancel" id="cp-cancel-btn">取消</button>' +
                      '<button class="cp-save" id="cp-save-btn">保存并应用</button>' +
                    '</div>' +
                  '</div>';
                  document.body.appendChild(modal);
                  
                  modal.querySelector('#cp-cancel-btn').onclick = function() { modal.remove(); };
                  modal.querySelector('#cp-save-btn').onclick = function() {
                    const newAvatar = modal.querySelector('#cp-input-avatar').value.trim();
                    const newBg = modal.querySelector('#cp-input-bg').value.trim();
                    
                    const data = JSON.parse(localStorage.getItem('sft_phone_v1') || '{}');
                    if (!data.chatSettings) data.chatSettings = {};
                    data.chatSettings[charId] = { avatar: newAvatar, bg: newBg };
                    localStorage.setItem('sft_phone_v1', JSON.stringify(data));
                    
                    modal.remove();
                    if (!newAvatar || !newBg) {
                       location.reload(); // 清除自定义后刷新，彻底恢复默认样式
                    } else {
                       window.applyCpSettings(); // 直接替换显示
                    }
                  };
                };

                // 监听并寻找插入齿轮按钮的位置
                setInterval(function() {
                  const charId = window.getCurrentCharId();
                  if (!charId) return;
                  
                  window.applyCpSettings();
                  
                  if (document.getElementById('cp-settings-btn')) return;
                  
                  let targetParent = null;
                  // 找“约见”旁白
                  const allElements = document.querySelectorAll('div, span, p');
                  for (let i=0; i<allElements.length; i++) {
                    const el = allElements[i];
                    if (el.children.length === 0 && el.textContent.includes('约见')) {
                      targetParent = el.parentNode;
                      break;
                    }
                  }
                  
                  // 如果没找到约见，就挂载在头部栏
                  if (!targetParent) {
                    targetParent = document.querySelector('.chat-header') || document.querySelector('.header') || document.querySelector('.top-bar');
                  }
                  
                  if (targetParent) {
                    const btn = document.createElement('div');
                    btn.id = 'cp-settings-btn';
                    btn.className = 'cp-settings-btn';
                    btn.innerHTML = '⚙️';
                    btn.title = '修改该角色头像/背景';
                    btn.onclick = function(e) { e.stopPropagation(); window.openCpSettings(charId); };
                    
                    if (targetParent.style.position !== 'absolute' && targetParent.style.position !== 'relative' && targetParent.style.position !== 'fixed') {
                       targetParent.style.position = 'relative';
                    }
                    
                    if (targetParent.textContent.includes('约见')) {
                       targetParent.appendChild(btn);
                    } else {
                       btn.style.position = 'absolute';
                       btn.style.right = '45px';
                       btn.style.top = '50%';
                       btn.style.transform = 'translateY(-50%)';
                       targetParent.appendChild(btn);
                    }
                  }
                }, 800);
                
                setTimeout(function() { window.applyCpSettings(); }, 300);
              }
            } catch(e) { console.warn('同步数据异常', e); }
          `;
          f.contentWindow.eval(jsCode);
        } catch(err) { console.warn('同步失败', err); }
      }
      return;
    }

    // 拦截“重新开始”按钮
    const targetNew = e.target.closest('[data-action="new-story"]');
    if (targetNew) {
      e.preventDefault(); e.stopPropagation();
      win.showConfirm('重新开始', '确定要完全重新开始吗？将清空所有进度、手机聊天记录和个人设定。', () => {
        // 1) 手机端数据
        localStorage.removeItem('sft_phone_v1');
        for (let i = localStorage.length - 1; i >= 0; i--) {
          const key = localStorage.key(i);
          if (key && key.startsWith('sft_phone_story_')) localStorage.removeItem(key);
        }

        // 2) 游戏主存档
        let storeKey = '';
        try { storeKey = win.eval('typeof STORE === "string" ? STORE : ""'); } catch (err) {}
        if (!storeKey) storeKey = 'yueying-visual-novel-v16';
        localStorage.removeItem(storeKey);

        // 3) 其它本地资源（自定义字体）
        localStorage.removeItem('yueying-custom-font');

        // 4) 重启
        try {
          window.top.location.reload();
        } catch (err) {
          try {
            document.getElementById('boot').classList.remove('hide');
            frame.src = './legacy.html?v=' + Date.now();
          } catch (e2) { location.reload(); }
        }
      });
      return;
    }
  }, true);

  // 3. 模式判断
  function isStoryMode(){
    try{const raw=localStorage.getItem('sft_phone_v1');if(!raw)return false;return (JSON.parse(raw).mode||'ai')==='story';}
    catch(e){return false;}
  }
  win.isStoryMode=isStoryMode;window.isStoryMode=isStoryMode;

  function getPhoneData(){try{return JSON.parse(localStorage.getItem('sft_phone_v1'))||{};}catch(e){return{};}}

  function injectScript(src,cb){
    const s=doc.createElement('script');
    s.src=src;s.onload=()=>cb&&cb();s.onerror=()=>console.warn('[启动器] 脚本加载失败：',src);
    doc.body.appendChild(s);
  }

  // 4. 拦截场景渲染
  function hookScene(){
    const origRenderScene = win.renderScene;
    win.renderScene = function() {
      if(win.state && win.state.story && win.state.story.length > 0) {
        const current = win.state.story[win.state.cursor];
        
        // 获取秦梧联系方式时
        if (current && current.speaker === '秦梧' && current.text.includes('以后有事可以找我呀')) {
          const p = getPhoneData();
          p.contacts = p.contacts || [];
          if (!p.contacts.includes('qinwu')) {
            p.contacts.push('qinwu');
            localStorage.setItem('sft_phone_v1', JSON.stringify(p));
            
            // 1. 浮动弹窗提示
            if (typeof win.toast === 'function') win.toast('【获得秦梧的联系方式】');
            
            // 2. 正文旁白插入（去重）
            if (!win.state.story.some(s => s.id === 'notify_qinwu_contact')) {
              win.state.story.splice(win.state.cursor + 1, 0, {
                id: 'notify_qinwu_contact',
                speaker: '旁白',
                text: '【获得秦梧的联系方式】'
              });
              if (typeof win.persist === 'function') win.persist();
            }
          }
        }
      }
      
      const mapBtn = doc.querySelector('[data-action="open-map"]');
      if(mapBtn) mapBtn.parentElement.style.display = isStoryMode() ? 'none' : '';
      
      if (isStoryMode() && typeof win.renderStoryScene === 'function') {
        win.renderStoryScene();
        return;
      }
      return origRenderScene.call(this);
    };
  }

  // 5. 构建发给 AI 的上下文
  function buildPhoneContext(){
    try{
      const p=getPhoneData();
      const chars=win.state.characters||[];
      const lines=[];
      lines.push('【手机私聊最近消息】');
      const chatLines=[];
      for(const cid in (p.chats||{})){
        const c=chars.find(x=>String(x.id)===String(cid));
        if(!c)continue;
        const list=(p.chats[cid]||[]).filter(m=>m.r!=='sys').slice(-5);
        if(!list.length)continue;
        chatLines.push(`--- ${c.name} ---`);
        list.forEach(m=>chatLines.push(`${m.r==='user'?'玩家':c.name}：${m.c}`));
      }
      lines.push(chatLines.join('\n')||'（暂无）');
      lines.push('\n【朋友圈最近动态】');
      const moLines=(p.moments||[]).slice(0,5).map(m=>`${m.authorName}：${m.text}`);
      lines.push(moLines.join('\n')||'（暂无）');
      lines.push('\n【角色关系】');
      const relLines=[];
      for(const idA in (p.relations||{})){
        const cA=chars.find(x=>String(x.id)===String(idA));
        if(!cA)continue;
        for(const idB in p.relations[idA]){
          const r=p.relations[idA][idB];if(!r.known)continue;
          const cB=chars.find(x=>String(x.id)===String(idB));if(!cB)continue;
          relLines.push(`${cA.name} 与 ${cB.name}：${r.relation||'认识'}`);
        }
      }
      lines.push(relLines.join('\n')||'（暂无）');
      if(p.activeMeetup){
        lines.push(`\n【当前约见】${p.activeMeetup.charName} 约在 ${p.activeMeetup.location}（${p.activeMeetup.daysFromNow===0?'今天':p.activeMeetup.daysFromNow+'天后'}）`);
      }
      return lines.join('\n');
    }catch(e){return '';}
  }

  function parseSpecialMarkers(text){
    const RE=/\[(朋友圈|消息|加好友)[:：]([^\]]+)\]/g;
    const actions=[];
    const clean=text.replace(RE,(all,type,body)=>{
      const parts=body.split('|').map(s=>s.trim());
      if(parts.length>=1)actions.push({type,parts});
      return '';
    }).trim();
    return {clean,actions};
  }

  function executeMarkerActions(actions){
    const p=getPhoneData();
    const chars=win.state.characters||[];
    for(const act of actions){
      if(act.type==='加好友'){
        const charName=act.parts[0];
        const c=chars.find(x=>x.name===charName);
        if(c){
          p.contacts=p.contacts||[];
          if(!p.contacts.includes(String(c.id))){
            p.contacts.push(String(c.id));
            if(typeof win.toast==='function')win.toast(`（${charName} 加你为好友了）`);
          }
        }
        continue;
      }
      if(act.parts.length<2) continue;
      const [charName,content]=act.parts;
      const c=chars.find(x=>x.name===charName);
      if(!c)continue;
      if(act.type==='朋友圈'){
        p.moments=p.moments||[];
        p.moments.unshift({
          id:'m_'+Date.now()+Math.random().toString(36).slice(2,6),
          authorId:c.id,authorName:charName,
          authorAvatar:c.portraitUrl||c.a||'',
          text:content,t:Date.now(),comments:[]
        });
        if(typeof win.toast==='function')win.toast(`（你注意到手机震了一下，${charName} 发了条朋友圈）`);
      }else if(act.type==='消息'){
        p.chats=p.chats||{};
        (p.chats[c.id]=p.chats[c.id]||[]).push({r:'ai',c:content,t:Date.now()});
        if(typeof win.toast==='function')win.toast(`（${charName} 给你发了条消息）`);
      }
    }
    localStorage.setItem('sft_phone_v1',JSON.stringify(p));
  }

  // 6. 拦截 AI 生成逻辑
  function hookAPI(){
    if(typeof win.buildSystem==='function'){
      const origBuild=win.buildSystem;
      win.buildSystem=function(){
        const base=origBuild.call(this);
        const phoneCtx=buildPhoneContext();
        let prefix='';
        if(phoneCtx)prefix+=`\n【手机端上下文】\n${phoneCtx}\n`;
        prefix += '\n【剧情中角色自发行动标记（不显示给玩家）】\n';
        prefix += '[朋友圈:角色名|内容]  表示该角色发了一条朋友圈\n';
        prefix += '[消息:角色名|内容]    表示该角色私聊玩家发了消息\n';
        prefix += '\n【关于加好友】\n';
        if (win.state.settings.enableMVU) {
          prefix += '如果玩家在线下请求加某个角色好友，或某角色想主动加玩家好友，请根据该角色的 MVU 好感度和人设判断。好感度高或热情的人设更容易同意/主动。如果同意，请输出 [加好友:角色名] 。\n';
        } else {
          prefix += '如果玩家在线下请求加某个角色好友，或某角色想主动加玩家好友，请根据人设和记忆判断。热情的人设更容易同意/主动。如果同意，请输出 [加好友:角色名] 。\n';
        }
        if(win.state.settings.enableMVU&&typeof win.mvuBuildPrompt==='function')return win.mvuBuildPrompt()+prefix+base;
        return prefix+base;
      };
    }

    if(typeof win.callChat==='function'){
      const origChat=win.callChat;
      win.callChat=async function(messages){
        const reply=await origChat.call(this,messages);
        let out=reply;
        if(win.state.settings.enableMVU&&typeof win.mvuParseFromReply==='function'&&typeof win.mvuApplyPatch==='function'){
          try{
            const patches=win.mvuParseFromReply(out);
            if(patches&&patches.length)win.mvuApplyPatch(patches);
            if(typeof win.mvuStripVariableBlocks==='function')out=win.mvuStripVariableBlocks(out);
          }catch(e){console.warn('[MVU] 解析失败',e);}
        }
        const {clean,actions}=parseSpecialMarkers(out);
        if(actions.length)executeMarkerActions(actions);
        return clean;
      };
    }
  }

  function injectMVUToggle(){
    const status=doc.getElementById('apiStatus');
    if(!status||doc.getElementById('mvuToggleRow'))return;
    const actionsDiv=status.parentElement;
    if(!actionsDiv||!actionsDiv.parentNode)return;
    const checked=win.state.settings.enableMVU?'checked':'';
    const row=doc.createElement('div');
    row.id='mvuToggleRow';row.className='switch-row';row.style.marginTop='8px';
    row.innerHTML='<div class="switch-copy"><strong>启用 MVU 变量同步</strong><small>开启后生成剧情会附带当前世界变量，并解析 AI 输出的 UpdateVariable 来推进数值</small></div><label class="switch"><input type="checkbox" id="mvuCheckbox" '+checked+'><span class="switch-ui"></span></label>';
    actionsDiv.parentNode.insertBefore(row,actionsDiv);
    doc.getElementById('mvuCheckbox').addEventListener('change',function(e){
      win.state.settings.enableMVU=e.target.checked;
      win.persist();
    });
  }

  win.parent.startStoryById=function(storyId){ if(typeof win.startStoryById==='function')win.startStoryById(storyId); };
  win.parent.closePhoneOverlay=function(){const ov=doc.getElementById('phoneOverlay');if(ov)ov.hidden=true;};
  win.parent.renderMainScene=function(){if(typeof win.renderScene==='function')win.renderScene();};
  win.parent.onMeetupAccepted=function(meetup){ if(typeof win.toast==='function')win.toast(`约见已确认：${meetup.location}`); };
  win.parent.onMeetupCancelled=function(){ if(typeof win.toast==='function')win.toast('约见已取消'); };

  whenReady(()=>{
    setupObserver();
    hookScene();
    hookAPI();
    
    // 劫持 renderPanel，只为了插入 MVU 开关
    const origRenderPanel=win.renderPanel;
    win.renderPanel=function(){
      origRenderPanel.call(this);
      setTimeout(injectMVUToggle,20);
    };

    injectScript('./story-engine.js');
    injectScript('./js/mvu.js');
    console.log('[启动器] V1.2 注入成功');
  });
}
</script>
</body>
</html>
