<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>人物设定</title>
<style>
  /* ===== 默认值兜底（跟随系统主题） ===== */
  :root {
    --bg: #fbf9f4; --surface: #fff; --surface-2: #faf8f3;
    --text: #1c1c1e; --muted: #8b877e; --line: rgba(28,28,30,.14);
    --accent: #1c1c1e; --radius: 8px;
    --p-paper: #fff; --p-ink: #1c1c1e;
    --font-family: "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "Microsoft YaHei", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151519; --surface: #1b1b20; --surface-2: #151519;
      --text: #eceae5; --muted: #807d76; --line: rgba(236,234,229,.14);
      --accent: #eceae5; --p-paper: #111; --p-ink: #eee;
    }
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    font-family: var(--font-family); color: var(--text); background: var(--surface); 
    font-size: 16px; line-height: 1.65; -webkit-font-smoothing: antialiased;
    padding: 24px 28px 60px; height: 100vh; overflow-y: auto; scrollbar-width: thin;
  }

  /* ===== 完美还原 legacy 的布局结构 ===== */
  .character-layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 26px; }
  .character-list { display: flex; flex-wrap: wrap; gap: 5px; align-content: flex-start; }
  
  .character-select { 
    display: inline-flex; align-items: center; justify-content: space-between; gap: 6px; 
    min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 3px; 
    background: var(--surface-2); color: var(--text); text-align: left; font-size: 14px; 
    transition: all .2s; cursor: pointer; flex: 1 1 45%;
  }
  .character-select.active { border-color: var(--accent); background: oklch(0.65 0.16 250 / .15); color: var(--accent); font-weight: 600; }
  .built-in-tag { font: 10px/1.4 sans-serif; color: var(--muted); font-weight: normal; }
  
  .add-char-btn {
    width: 100%; min-height: 44px; border: 1px dashed var(--line); border-radius: 3px;
    background: transparent; color: var(--text); font-size: 14px; cursor: pointer; transition: .2s;
    display: flex; align-items: center; justify-content: center; margin-top: 4px;
  }
  .add-char-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* 编辑器区域 */
  .editor-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  .editor-head h3 { font-size: 21px; font-weight: 500; letter-spacing: .1em; }
  .group { padding: 20px 0; border-bottom: 1px solid var(--line); }
  .group:first-child { padding-top: 0; }
  .group:last-child { border-bottom: none; }
  .group-title { display: flex; align-items: center; gap: 10px; font-size: 17px; margin-bottom: 16px; font-weight: 500; }

  /* 提示框 */
  .locked-note { padding: 14px 16px; border: 1px dashed var(--line); color: var(--muted); font: 13px/1.7 "Microsoft YaHei", sans-serif; border-radius: 3px; margin-bottom: 20px; }

  /* 表单布局 */
  .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px; }
  .field { display: grid; gap: 7px; min-width: 0; margin-bottom: 16px; }
  .field.full { grid-column: 1 / -1; }
  .field label { font: 13px/1.5 "Microsoft YaHei", sans-serif; color: var(--muted); }
  .field input, .field textarea, .field select { 
    width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--line); 
    border-radius: 3px; background: var(--surface-2); color: var(--text); 
    font-family: inherit; font-size: 15px; transition: border-color .2s, background .3s; 
  }
  .field textarea { min-height: 100px; resize: vertical; line-height: 1.7; }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }
  .field input:disabled { opacity: 0.5; background: var(--bg); cursor: not-allowed; }
  
  /* 开关组件 */
  .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 54px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .switch-copy strong { display: block; font-weight: 500; font-size: 16px; }
  .switch-copy small { display: block; color: var(--muted); font: 13px/1.6 "Microsoft YaHei", sans-serif; margin-top: 4px; }
  .switch { position: relative; flex: 0 0 48px; width: 48px; height: 26px; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; z-index: 2; }
  .switch-ui { display: block; width: 100%; height: 100%; border: 1px solid var(--muted); border-radius: 20px; transition: background .2s, border-color .2s; pointer-events: none; }
  .switch-ui:after { content: ""; position: absolute; left: 4px; top: 4px; width: 18px; height: 18px; border-radius: 50%; background: var(--muted); transition: transform .2s, background .2s; }
  .switch input:checked + .switch-ui { background: var(--accent); border-color: var(--accent); }
  .switch input:checked + .switch-ui:after { transform: translateX(22px); background: var(--p-paper); }

  /* 方案操作栏 */
  .scheme-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }
  .scheme-bar select { flex: 1; min-height: 44px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 3px; background: var(--surface-2); color: var(--text); font-family: inherit; font-size: 15px; }
  .btn { min-height: 44px; padding: 0 16px; border-radius: 3px; font: 500 14px/1.5 "Microsoft YaHei", sans-serif; transition: .2s; cursor: pointer; white-space: nowrap; }
  .secondary-btn { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }
  .danger-btn { background: transparent; color: oklch(0.7 0.16 25); border: 1px solid oklch(0.7 0.16 25 / .5); }
  .text-btn { min-height: 36px; border: 0; background: transparent; color: var(--muted); padding: 4px 6px; cursor: pointer; font: 13px/1.4 "Microsoft YaHei", sans-serif; }
  .text-btn:hover { color: var(--text); text-decoration: underline; }

  /* ===== 手机端完全还原 legacy 的上下堆叠布局 ===== */
  @media(max-width:760px){
    body { padding: 16px 16px 60px; }
    .character-layout { grid-template-columns: 1fr; gap: 16px; }
    .form-grid { grid-template-columns: 1fr; }
    .field.full { grid-column: auto; }
    .scheme-bar { flex-wrap: wrap; }
    .scheme-bar select { width: 100%; flex: auto; margin-bottom: 8px; }
  }
</style>
</head>
<body>

<div class="character-layout">
  <div class="character-list-wrap" style="display:flex; flex-direction:column; gap:12px;">
    <div style="font-size:14px; color:var(--muted); font-family:'Microsoft YaHei',sans-serif;">当前登场角色</div>
    <div class="character-list" id="charList"></div>
    <button class="add-char-btn" onclick="addCharacter()">+ 手动创建角色</button>
  </div>
  <div class="character-editor" id="charEditor"></div>
</div>

<script>
let state = null;
try {
  state = window.parent.state;
} catch(e) {
  document.body.innerHTML = '<p style="color:red;padding:20px;">无法获取游戏数据，请确保在游戏中打开此页面。</p>';
}

if (state) {
  // ================= 1. 强制修复旧版本数据缺失导致的 Bug =================
  // 确保所有角色（特别是除秦梧外的内置角色）都有 customProfile 字段
  state.characters.forEach(c => {
    if (!c.customProfile || typeof c.customProfile !== 'object') {
      c.customProfile = { identity:'', relation:'', address:'', personality:'', description:'' };
    }
    if (c.useCustomProfile === undefined) c.useCustomProfile = false;
    if (c.useCustomVoice === undefined) c.useCustomVoice = false;
    if (c.useSprite === undefined) c.useSprite = true;
    
    if (!c.builtIn) {
      if (!c.schemes || !c.schemes.length) {
        c.schemes = [{ id: 'default', name: '默认方案', data: {} }];
        c.activeScheme = 'default';
      }
    }
  });

  // 获取资源库导入的设定（如果有）
  const resourceChars = state.custom_resources?.characters || [];

  let currentId = state.characters[0]?.id || '';
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function saveState() { try { window.parent.persist(true); } catch(e) {} }

  // ================= 2. 左侧列表渲染 =================
  function renderList() {
    const list = document.getElementById('charList');
    list.innerHTML = state.characters.map(c => `
      <button class="character-select ${c.id === currentId ? 'active' : ''}" onclick="selectChar('${c.id}')">
        <span>${esc(c.name)}</span> ${c.builtIn ? '<span class="built-in-tag">内置</span>' : ''}
      </button>
    `).join('');
  }

  window.selectChar = (id) => { currentId = id; renderList(); renderEditor(); };

  window.addCharacter = () => {
    const newChar = {
      id: 'custom_' + Date.now(), builtIn: false, name: '新角色', gender: '女',
      identity: '', relation: '同学', address: '你', personality: '', description: '',
      useSprite: true, portraitId: '', activeScheme: 'default', 
      schemes: [{ id: 'default', name: '默认方案', data: {} }],
      district: '其他', preferredLocations: '', voiceOverride: '', useCustomVoice: false, voiceEnabled: false
    };
    state.characters.push(newChar);
    saveState(); currentId = newChar.id;
    renderList(); renderEditor();
  };

  window.deleteCharacter = () => {
    if (!confirm('确定要删除这个角色吗？此操作不可逆！')) return;
    state.characters = state.characters.filter(c => c.id !== currentId);
    if (state.selectedCharacterId === currentId) state.selectedCharacterId = state.characters[0]?.id || '';
    currentId = state.characters[0]?.id || '';
    saveState(); renderList(); renderEditor();
  };

  // ================= 3. 获取当前生效的设定数据 =================
  function getActiveData(c) {
    if (c.builtIn) {
      return c.useCustomProfile ? c.customProfile : { identity:'', relation:'', address:'', personality:'', description:'' };
    } else {
      const scheme = c.schemes.find(s => s.id === c.activeScheme) || c.schemes[0];
      return scheme.data || {};
    }
  }

  // ================= 4. 渲染右侧编辑器（原生 UI 顺序） =================
  function renderEditor() {
    const c = state.characters.find(x => x.id === currentId);
    const box = document.getElementById('charEditor');
    if (!c) { box.innerHTML = '<p style="color:var(--muted)">请选择或新建一个角色。</p>'; return; }

    const data = getActiveData(c);
    // 查找资源库里是否有这个角色的同名设定
    const sameNameRes = resourceChars.filter(r => r.name === c.name);

    let html = `
      <div class="editor-head">
        <h3>${esc(c.name)}</h3>
        ${!c.builtIn ? `<button class="text-btn" style="color:oklch(0.7 0.16 25)" onclick="deleteCharacter()">删除角色</button>` : ''}
      </div>
    `;

    // ===== 设定来源（下拉框） =====
    html += `<div class="field full">
      <label>设定来源</label>`;
    
    if (c.builtIn) {
      // 内置角色
      html += `<select onchange="changeSource(this.value)">`;
      html += `<option value="builtin" ${!c.useCustomProfile ? 'selected' : ''}>使用内置设定</option>`;
      html += `<option value="custom" ${c.useCustomProfile ? 'selected' : ''}>自定义填写</option>`;
      
      // 如果有资源库的设定，加进去
      sameNameRes.forEach((r, i) => {
        html += `<option value="res_${i}">资源库设定 (${esc(r.name)})</option>`;
      });
      html += `</select>`;
    } else {
      // 自定义角色，显示方案选择器
      html += `
        <div class="scheme-bar" style="margin-bottom:0;">
          <select onchange="switchScheme(this.value)">
            ${c.schemes.map(s => `<option value="${s.id}" ${s.id === c.activeScheme ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}
            ${sameNameRes.length > 0 ? `<option disabled>---- 资源库设定 ----</option>` : ''}
            ${sameNameRes.map((r, i) => `<option value="res_${i}">导入: ${esc(r.name)} 的设定</option>`).join('')}
          </select>
          <button class="btn secondary-btn" onclick="addScheme()">新建方案</button>
          <button class="btn danger-btn" onclick="deleteScheme()" ${c.schemes.length <= 1 ? 'disabled' : ''}>删除</button>
        </div>
      `;
    }
    html += `</div>`;

    // ===== 中间详细设定表单 =====
    // 如果是内置角色且选了“使用内置设定”，不显示这些框
    if (c.builtIn && !c.useCustomProfile) {
      html += `
        <div class="locked-note">
          当前正在使用该角色的**官方内置设定**。<br>
          如果你想覆盖或修改其性格、经历，请在上方【设定来源】中选择“自定义填写”。<br>
          切回内置设定不会删除你已填写的自定义内容。
        </div>
      `;
    } else {
      html += `
        <div class="group">
          <div class="group-title">详细设定</div>
          <div class="form-grid">
            <div class="field">
              <label>姓名</label>
              <input value="${esc(c.name)}" ${c.builtIn ? 'disabled placeholder="内置不可改名"' : `oninput="updateField('name', this.value)"`}>
            </div>
            <div class="field">
              <label>性别</label>
              <select ${c.builtIn ? 'disabled' : `onchange="updateField('gender', this.value)"`}>
                <option value="男" ${c.gender === '男' ? 'selected' : ''}>男</option>
                <option value="女" ${c.gender === '女' ? 'selected' : ''}>女</option>
              </select>
            </div>
            <div class="field"><label>身份</label><input value="${esc(data.identity || '')}" oninput="updateField('identity', this.value)" placeholder="${c.builtIn ? '留空则沿用内置' : ''}"></div>
            <div class="field"><label>关系</label><input value="${esc(data.relation || '')}" oninput="updateField('relation', this.value)" placeholder="${c.builtIn ? '留空则沿用内置' : ''}"></div>
            <div class="field full"><label>对玩家的称呼</label><input value="${esc(data.address || '')}" oninput="updateField('address', this.value)" placeholder="${c.builtIn ? '留空则沿用内置' : ''}"></div>
            <div class="field full"><label>性格设定</label><textarea oninput="updateField('personality', this.value)" placeholder="${c.builtIn ? '留空则沿用内置' : ''}">${esc(data.personality || '')}</textarea></div>
            <div class="field full"><label>外貌描述</label><textarea oninput="updateField('description', this.value)" placeholder="${c.builtIn ? '留空则沿用内置' : ''}">${esc(data.description || '')}</textarea></div>
          </div>
        </div>
      `;
    }

    // ===== 音色配置 =====
    html += `
      <div class="group">
        <div class="field full">
          <label>音色配置</label>
          <select onchange="updateField('useCustomVoice', this.value === '1')">
            <option value="0" ${!c.useCustomVoice ? 'selected' : ''}>使用内置音色</option>
            <option value="1" ${c.useCustomVoice ? 'selected' : ''}>自定义填写</option>
          </select>
        </div>
        ${c.useCustomVoice ? `
          <div class="field full" style="margin-top:-8px;">
            <input value="${esc(c.voiceOverride || '')}" oninput="updateField('voiceOverride', this.value)" placeholder="填写 Voice ID (例如: female-shaonv)">
          </div>
        ` : ''}
        
        <div class="switch-row" style="border-bottom:none;">
          <div class="switch-copy">
            <strong>开启单角色语音</strong>
            <small>允许该角色说话时发声（即使填写了ID也要开启才会发声）</small>
          </div>
          <label class="switch"><input type="checkbox" ${c.voiceEnabled ? 'checked' : ''} onchange="updateField('voiceEnabled', this.checked)"><span class="switch-ui"></span></label>
        </div>
      </div>
    `;

    // ===== 地点与立绘 =====
    html += `
      <div class="group">
        <div class="field full">
          <label>所在小区</label>
          <select onchange="updateField('district', this.value)">
            <option value="常去" ${c.district === '常去' ? 'selected' : ''}>常去小区</option>
            <option value="其他" ${c.district === '其他' ? 'selected' : ''}>其他小区</option>
          </select>
        </div>
        <div class="field full">
          <label>偏好地点</label>
          <input value="${esc(c.preferredLocations || '')}" oninput="updateField('preferredLocations', this.value)" placeholder="可在此输入大地图中的地点名">
        </div>
        
        <div class="switch-row" style="${c.useSprite !== false ? '' : 'border-bottom:none;'}">
          <div class="switch-copy">
            <strong>使用立绘</strong>
            <small>说话时是否展示该角色立绘</small>
          </div>
          <label class="switch"><input type="checkbox" ${c.useSprite !== false ? 'checked' : ''} onchange="updateField('useSprite', this.checked)"><span class="switch-ui"></span></label>
        </div>
        ${c.useSprite !== false ? `
          <div class="field full" style="margin-top:16px;">
            <label>绑定立绘</label>
            <select onchange="updateField('portraitId', this.value)">
              <option value="">自动匹配</option>
              ${state.images.map(img => `<option value="${img.id}" ${c.portraitId === img.id ? 'selected' : ''}>${esc(img.name)}</option>`).join('')}
            </select>
          </div>
        ` : ''}
      </div>
    `;

    box.innerHTML = html;
  }

  // ================= 5. 核心数据操作 =================
  window.updateField = (path, value) => {
    const c = state.characters.find(x => x.id === currentId);
    if (!c) return;

    // 属于基础设定的字段
    const baseFields = ['identity', 'relation', 'address', 'personality', 'description'];

    if (baseFields.includes(path)) {
      if (c.builtIn) {
        c.customProfile[path] = value; // 内置角色写到 customProfile
      } else {
        const scheme = c.schemes.find(s => s.id === c.activeScheme) || c.schemes[0];
        if (!scheme.data) scheme.data = {};
        scheme.data[path] = value;
        c[path] = value; // 同步一份到顶层
      }
    } else {
      c[path] = value; // 其他直接写顶层
    }
    
    saveState();
    
    if (['useCustomProfile', 'useCustomVoice', 'useSprite', 'name'].includes(path)) {
      if (path === 'name') renderList();
      renderEditor();
    }
  };

  // 处理“设定来源”下拉框切换
  window.changeSource = (val) => {
    const c = state.characters.find(x => x.id === currentId);
    if (!c) return;
    
    if (val === 'builtin') {
      c.useCustomProfile = false;
    } else if (val === 'custom') {
      c.useCustomProfile = true;
    } else if (val.startsWith('res_')) {
      // 选用了资源库设定
      const idx = parseInt(val.replace('res_', ''));
      const resData = sameNameRes[idx];
      if (resData) {
        // 将资源库数据复制到自定义里供玩家修改
        c.customProfile = { ...resData };
        c.useCustomProfile = true;
      }
    }
    saveState(); renderEditor();
  };

  // ================= 6. 方案操作 =================
  window.switchScheme = (id) => {
    const c = state.characters.find(x => x.id === currentId);
    if (!c || c.builtIn) return;

    if (id.startsWith('res_')) {
      // 从资源库导入为一个新方案
      const idx = parseInt(id.replace('res_', ''));
      const resData = sameNameRes[idx];
      if (resData) {
        const newId = 'scheme_res_' + Date.now();
        c.schemes.push({ id: newId, name: '导入:' + resData.name, data: { ...resData } });
        c.activeScheme = newId;
      }
    } else {
      c.activeScheme = id;
    }
    
    const active = c.schemes.find(s => s.id === c.activeScheme);
    if (active && active.data) Object.assign(c, active.data);
    saveState(); renderEditor();
  };

  window.addScheme = () => {
    const c = state.characters.find(x => x.id === currentId);
    if (!c || c.builtIn) return;
    const name = prompt('请输入新方案名称：', '方案 ' + (c.schemes.length + 1));
    if (!name) return;
    const id = 'scheme_' + Date.now();
    c.schemes.push({ id: id, name: name, data: JSON.parse(JSON.stringify(getActiveData(c))) });
    c.activeScheme = id; saveState(); renderEditor();
  };

  window.deleteScheme = () => {
    const c = state.characters.find(x => x.id === currentId);
    if (!c || c.builtIn || c.schemes.length <= 1) return;
    if (!confirm('确定删除当前方案吗？')) return;
    c.schemes = c.schemes.filter(s => s.id !== c.activeScheme);
    c.activeScheme = c.schemes[0].id;
    switchScheme(c.activeScheme);
  };

  // ================= 7. 继承主题并初始化 =================
  try {
    const pStyle = window.parent.getComputedStyle(window.parent.document.body);
    ['--bg', '--surface', '--surface-2', '--text', '--muted', '--line', '--accent', '--radius', '--p-paper', '--p-ink'].forEach(v => {
      let val = pStyle.getPropertyValue(v);
      if(val) document.documentElement.style.setProperty(v, val);
    });
    let font = pStyle.getPropertyValue('font-family');
    if(font) document.documentElement.style.setProperty('--font-family', font);
  } catch(e) {}

  renderList();
  renderEditor();
}
</script>
</body>
</html>
