<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,viewport-fit=cover">
<title>手机</title>
<style>
:root{--p-ink:oklch(0.16 0.018 255);--p-paper:oklch(0.96 0.008 240);--p-blue:oklch(0.65 0.16 250);--radius:8px;--ease:cubic-bezier(.25,1,.5,1);--success:oklch(0.65 0.16 145);--danger:oklch(0.7 0.16 25);}
body.theme-dark{--bg:oklch(0.16 0.018 255);--text:oklch(0.96 0.008 240);--muted:oklch(0.72 0.018 250);--surface:oklch(0.21 0.022 255 / .94);--surface-2:oklch(0.27 0.025 255 / .8);--glass:oklch(0.15 0.02 255 / .8);--line:oklch(0.8 0.025 250 / .18);--accent:oklch(0.65 0.16 250);--bubble-ai:oklch(0.25 0.03 255);--bubble-user:oklch(0.35 0.12 145);--bubble-text:oklch(0.96 0.008 240);}
body.theme-light{--bg:oklch(0.94 0.01 240);--text:oklch(0.16 0.018 255);--muted:oklch(0.45 0.025 250);--surface:oklch(0.98 0.008 240 / .94);--surface-2:oklch(0.92 0.015 240 / .8);--glass:oklch(0.98 0.008 240 / .85);--line:oklch(0.16 0.018 255 / .15);--accent:oklch(0.5 0.15 250);--bubble-ai:oklch(1 0 0);--bubble-user:oklch(0.85 0.1 145);--bubble-text:oklch(0.16 0.018 255);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Noto Serif CJK SC","Source Han Serif SC","Songti SC","Microsoft YaHei",serif;}
html,body{height:100%;width:100%;background:#111;overflow:hidden;color:var(--text);}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);max-width:520px;margin:0 auto;transition:background .3s,color .3s;}
#nav{height:52px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative;backdrop-filter:blur(14px);}
#nav-title{font-weight:600;font-size:16px;letter-spacing:.05em;}
#nav-close{position:absolute;left:14px;font-size:20px;cursor:pointer;color:var(--text);background:transparent;border:0;padding:6px;line-height:1;border-radius:50%;transition:background .2s;}
#nav-close:hover{background:var(--line);}
#nav-action{position:absolute;right:14px;color:var(--accent);font-size:13px;cursor:pointer;background:transparent;border:0;padding:6px 12px;border-radius:6px;letter-spacing:.05em;}
#nav-action:hover{background:var(--line);}
#viewport{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.page{display:none;min-height:100%;}
.page.active{display:block;}
.cell{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface);cursor:pointer;transition:background .2s;}
.cell:hover{background:var(--surface-2);}
.avatar{width:48px;height:48px;border-radius:var(--radius);object-fit:cover;background:var(--surface-2);flex-shrink:0;margin-right:12px;}
.cell-body{flex:1;min-width:0;}
.cell-name{font-size:15px;color:var(--text);}
.cell-sub{font-size:12px;color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.empty{color:var(--muted);text-align:center;padding:60px 20px;font-size:14px;}
#tabbar{height:60px;flex-shrink:0;display:flex;background:var(--surface);border-top:1px solid var(--line);backdrop-filter:blur(14px);}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--muted);cursor:pointer;gap:3px;letter-spacing:.05em;transition:color .2s;}
.tab .ico{font-size:18px;}
.tab.active{color:var(--accent);}
#chat{position:absolute;inset:0;background:var(--bg) center/cover;z-index:20;display:none;flex-direction:column;max-width:520px;margin:0 auto;}
#chat::before{content:"";position:absolute;inset:0;background:var(--glass);z-index:-1;backdrop-filter:blur(2px);}
#chat-nav{height:52px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;position:relative;flex-shrink:0;z-index:2;backdrop-filter:blur(14px);}
#chat-nav .back{position:absolute;left:12px;font-size:24px;cursor:pointer;padding:6px 12px;}
#chat-nav .title{width:100%;text-align:center;font-weight:600;font-size:16px;letter-spacing:.05em;}
#chat-nav .actions{position:absolute;right:12px;display:flex;gap:6px;}
#chat-nav .actions button{background:var(--surface-2);border:1px solid var(--line);color:var(--text);font-size:12px;padding:6px 12px;border-radius:var(--radius);cursor:pointer;letter-spacing:.05em;}
#chat-nav .actions button:hover{background:var(--accent);color:var(--p-paper);border-color:var(--accent);}
#chat-area{flex:1;overflow-y:auto;padding:16px;position:relative;z-index:1;}
.msg{display:flex;margin-bottom:14px;}
.msg.user{flex-direction:row-reverse;}
.msg .avatar{width:38px;height:38px;margin:0 8px;border-radius:6px;}
.bubble{max-width:72%;padding:10px 14px;font-size:14.5px;line-height:1.6;background:var(--bubble-ai);color:var(--bubble-text);border-radius:10px;word-break:break-word;box-shadow:0 1px 4px rgba(0,0,0,.1);}
.msg.user .bubble{background:var(--bubble-user);}
.sys-line{text-align:center;margin:10px 0;}
.sys-line span{display:inline-block;font-size:11px;color:var(--muted);background:var(--surface-2);padding:4px 12px;border-radius:12px;letter-spacing:.05em;}
.invite-card{margin:8px 38px;background:var(--surface);border:1px solid var(--accent);border-radius:var(--radius);padding:14px;box-shadow:0 4px 16px rgba(0,0,0,.15);}
.invite-card .ic-title{font-size:14px;font-weight:600;color:var(--accent);margin-bottom:8px;letter-spacing:.05em;}
.invite-card .ic-info{font-size:13px;color:var(--text);line-height:1.7;margin-bottom:10px;}
.invite-card .ic-actions{display:flex;gap:8px;}
.invite-card .ic-actions button{flex:1;padding:8px;font-size:13px;border-radius:6px;border:0;cursor:pointer;letter-spacing:.05em;}
.invite-card .ic-actions .ok{background:var(--success);color:#fff;}
.invite-card .ic-actions .no{background:var(--surface-2);color:var(--text);border:1px solid var(--line);}
#chat-bar{padding:10px;background:var(--surface);border-top:1px solid var(--line);display:flex;gap:8px;flex-shrink:0;z-index:2;}
#chat-in{flex:1;height:38px;border:1px solid var(--line);border-radius:var(--radius);padding:0 12px;font-size:14px;outline:none;background:var(--surface-2);color:var(--text);font-family:inherit;}
#chat-in:focus{border-color:var(--accent);}
#chat-send{padding:0 18px;background:var(--accent);color:var(--p-paper);border:0;border-radius:var(--radius);font-size:14px;cursor:pointer;letter-spacing:.05em;}
.mo-cover{height:200px;background:var(--surface-2) center/cover;position:relative;margin-bottom:50px;}
.mo-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.5));}
.mo-user{position:absolute;right:18px;bottom:-22px;display:flex;align-items:center;gap:12px;z-index:2;}
.mo-user span{color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6);font-weight:600;letter-spacing:.05em;}
.mo-user img{width:72px;height:72px;border-radius:var(--radius);border:2px solid #fff;object-fit:cover;background:var(--surface-2);box-shadow:0 4px 16px rgba(0,0,0,.3);}
.post{background:var(--surface);padding:16px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px;}
.post .avatar{margin:0;}
.post-body{flex:1;min-width:0;}
.post-author{color:var(--accent);font-weight:600;font-size:14px;letter-spacing:.05em;}
.post-text{margin-top:6px;font-size:14.5px;white-space:pre-wrap;line-height:1.7;color:var(--text);}
.post-time{margin-top:6px;font-size:11px;color:var(--muted);}
.post-comments{background:var(--surface-2);border-radius:var(--radius);padding:10px 12px;margin-top:10px;font-size:13px;line-height:1.7;color:var(--text);}
.post-comments .cm{margin-bottom:4px;}
.post-comments .cm b{color:var(--accent);font-weight:600;}
.post-actions{display:flex;gap:10px;margin-top:12px;}
.post-actions button{font-size:12px;padding:5px 12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);color:var(--text);cursor:pointer;letter-spacing:.05em;}
.post-actions button:hover{border-color:var(--accent);color:var(--accent);}
.sec{padding:16px;background:var(--surface);border-bottom:1px solid var(--line);}
.sec-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:8px;letter-spacing:.05em;}
.sec-title::before{content:"";width:3px;height:14px;background:var(--accent);border-radius:2px;}
.row{display:flex;gap:8px;flex-wrap:wrap;}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
.field label{font-size:12px;color:var(--muted);letter-spacing:.05em;}
.field input{width:100%;height:40px;border:1px solid var(--line);border-radius:var(--radius);padding:0 12px;font-size:14px;outline:none;background:var(--surface-2);color:var(--text);font-family:inherit;}
.field input:focus{border-color:var(--accent);}
.mode-btn{padding:9px 20px;font-size:13.5px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface-2);color:var(--text);cursor:pointer;transition:.15s;letter-spacing:.05em;}
.mode-btn.on{border-color:var(--accent);background:var(--accent);color:var(--p-paper);}
.story-item{display:flex;align-items:center;padding:12px 14px;background:var(--surface-2);border-radius:var(--radius);margin-bottom:8px;cursor:pointer;border:1px solid var(--line);transition:.15s;}
.story-item.on{border-color:var(--accent);background:color-mix(in oklab,var(--accent) 15%,var(--surface-2));}
.story-item .meta{flex:1;min-width:0;}
.story-item .title{font-size:14px;color:var(--text);font-weight:500;letter-spacing:.05em;}
.story-item .sub{font-size:12px;color:var(--muted);margin-top:3px;}
.story-item .badge{font-size:11px;color:var(--accent);background:color-mix(in oklab,var(--accent) 20%,transparent);padding:3px 10px;border-radius:10px;font-weight:500;letter-spacing:.05em;}
.mat-group{margin-bottom:16px;}
.mat-group-title{font-size:12px;color:var(--muted);margin-bottom:8px;padding-left:2px;letter-spacing:.05em;}
.mat-item{padding:12px;background:var(--surface-2);border-radius:var(--radius);margin-bottom:8px;border:1px solid var(--line);}
.mat-head{display:flex;align-items:center;gap:8px;}
.mat-name{flex:1;font-size:14px;color:var(--text);font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.05em;}
.mat-toggle{display:flex;gap:4px;flex-shrink:0;}
.mat-toggle button{padding:5px 12px;font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:12px;cursor:pointer;transition:.15s;}
.mat-toggle button.on{background:var(--accent);color:var(--p-paper);border-color:var(--accent);}
.mat-custom-input{width:100%;margin-top:10px;height:38px;border:1px solid var(--line);border-radius:6px;padding:0 10px;font-size:13px;outline:none;background:var(--surface);color:var(--text);box-sizing:border-box;font-family:inherit;}
.mat-custom-input:focus{border-color:var(--accent);}
.loading{color:var(--muted);font-size:13px;padding:20px 0;text-align:center;}
.btn{padding:10px 18px;border-radius:var(--radius);border:0;background:var(--accent);color:var(--p-paper);font-size:14px;cursor:pointer;letter-spacing:.05em;}
.btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--line);}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s;}
.modal-mask[hidden]{display:none !important;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);width:100%;max-width:400px;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:slideUp .25s var(--ease);}
@keyframes slideUp{from{transform:translateY(20px);opacity:0;}to{transform:none;opacity:1;}}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.modal-header h3{font-size:16px;font-weight:600;letter-spacing:.05em;color:var(--text);}
.modal-header button{background:transparent;border:0;font-size:18px;color:var(--muted);cursor:pointer;padding:4px;line-height:1;}
.modal-body{padding:18px 20px;overflow-y:auto;font-size:14px;line-height:1.7;color:var(--text);flex:1;}
.modal-body textarea{width:100%;min-height:100px;border:1px solid var(--line);border-radius:var(--radius);padding:10px;font-size:14px;outline:none;background:var(--surface-2);color:var(--text);font-family:inherit;resize:vertical;box-sizing:border-box;}
.modal-body textarea:focus{border-color:var(--accent);}
.modal-body input,.modal-body select{width:100%;height:40px;border:1px solid var(--line);border-radius:var(--radius);padding:0 12px;font-size:14px;outline:none;background:var(--surface-2);color:var(--text);font-family:inherit;box-sizing:border-box;}
.modal-body input:focus,.modal-body select:focus{border-color:var(--accent);}
.modal-footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;}
.modal-footer button{padding:9px 18px;font-size:14px;border-radius:var(--radius);cursor:pointer;letter-spacing:.05em;}
.modal-footer .primary{background:var(--accent);color:var(--p-paper);border:0;}
.modal-footer .secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--line);}
.rel-item{padding:12px;background:var(--surface-2);border-radius:var(--radius);margin-bottom:8px;border:1px solid var(--line);}
.rel-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.rel-names{flex:1;font-size:14px;font-weight:500;color:var(--text);}
.rel-del{background:transparent;border:0;color:var(--danger);font-size:16px;cursor:pointer;padding:2px 8px;}
.rel-relation{font-size:12px;color:var(--muted);}
.meetup-card{padding:12px;background:var(--surface-2);border-radius:var(--radius);margin-bottom:8px;border:1px solid var(--accent);}
.meetup-card .mc-title{font-size:14px;font-weight:600;color:var(--accent);margin-bottom:6px;letter-spacing:.05em;}
.meetup-card .mc-info{font-size:13px;color:var(--text);line-height:1.7;}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:color-mix(in oklab,var(--accent) 20%,transparent);color:var(--accent);letter-spacing:.05em;}
</style>
</head>
<body class="theme-light">
<div id="app">
  <div id="nav">
    <button id="nav-close" onclick="closePhone()">✕</button>
    <div id="nav-title">消息</div>
    <button id="nav-action" onclick="navAction()" style="display:none">发布</button>
  </div>
  <div id="viewport">
    <div id="p-msg" class="page active"></div>
    <div id="p-moments" class="page"></div>
    <div id="p-mode" class="page"></div>
  </div>
  <div id="tabbar">
    <div class="tab active" data-tab="msg" data-action="switch-tab"><span class="ico">💬</span><span>消息</span></div>
    <div class="tab" data-tab="moments" data-action="switch-tab"><span class="ico">🌙</span><span>朋友圈</span></div>
    <div class="tab" data-tab="mode" data-action="switch-tab"><span class="ico">⚙️</span><span>设置</span></div>
  </div>
</div>

<div id="chat">
  <div id="chat-nav">
    <div class="back" onclick="closeChat()">‹</div>
    <div class="title" id="chat-title">聊天</div>
    <div class="actions">
      <button onclick="openInviteDialog()">约见</button>
      <!-- 新增的齿轮设置按钮 -->
      <button onclick="openCharSettings()" style="padding:6px 8px;" title="单独设置角色头像与背景">⚙️</button>
    </div>
  </div>
  <div id="chat-area"></div>
  <div id="chat-bar">
    <input id="chat-in" placeholder="输入消息..." onkeydown="if(event.key==='Enter')sendChat()">
    <button id="chat-send" onclick="sendChat()">发送</button>
  </div>
</div>

<div id="modal" class="modal-mask" hidden>
  <div class="modal-panel">
    <div class="modal-header"><h3 id="modalTitle">提示</h3><button onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<script>
'use strict';
const PKEY='sft_phone_v1',MANIFEST_KEY='sft_phone_manifest_cache',BUILTIN_KEY='sft_phone_builtin_materials';
const STORY_KEY=(id)=>'sft_phone_story_'+id;
let P=loadPhone();

function defaultPhone(){
  return{
    chats:{},moments:[],mode:'ai',activeStoryId:null,
    userProfile:{avatar:'',chatBg:'',momentsCover:''},
    charSettings:{}, // 新增：单角色独立设置
    materialOverrides:{},activeMeetup:null,pendingInvites:[],relations:{},contacts:[]
  };
}
function loadPhone(){
  try{
    const o=JSON.parse(localStorage.getItem(PKEY))||{};
    const base=defaultPhone();
    return Object.assign(base,o,{
      userProfile:Object.assign(base.userProfile,o.userProfile||{}),
      charSettings:o.charSettings||{}, // 合并单角色设置
      materialOverrides:o.materialOverrides||{},
      relations:o.relations||{},pendingInvites:o.pendingInvites||[],moments:o.moments||[],chats:o.chats||{},contacts:o.contacts||[]
    });
  }catch(e){return defaultPhone();}
}
function savePhone(){try{localStorage.setItem(PKEY,JSON.stringify(P));}catch(e){}}

let MANIFEST=[],BUILTIN_MATS=[];
async function loadManifest(){try{const c=JSON.parse(localStorage.getItem(MANIFEST_KEY)||'null');if(c)MANIFEST=c;}catch(e){}try{const r=await fetch('./stories/manifest.json',{cache:'no-cache'});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();let arr=Array.isArray(j)?j:(j.stories||[]);arr=arr.map((s,i)=>typeof s==='string'?{id:'s'+(i+1),title:s,file:'./stories/'+s+'.txt'}:s);MANIFEST=arr;localStorage.setItem(MANIFEST_KEY,JSON.stringify(MANIFEST));}catch(e){console.warn('[phone] 剧本清单加载失败：',e);}}
async function loadBuiltinMaterials(){try{const c=JSON.parse(localStorage.getItem(BUILTIN_KEY)||'null');if(c)BUILTIN_MATS=c;}catch(e){}try{const r=await fetch('./materials/builtin.json',{cache:'no-cache'});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();BUILTIN_MATS=Array.isArray(j)?j:(j.materials||[]);localStorage.setItem(BUILTIN_KEY,JSON.stringify(BUILTIN_MATS));}catch(e){console.warn('[phone] 内置素材加载失败：',e);}}

let LOCAL_STATE = { characters:[], player:{}, api:{}, mvu:{}, settings:{} };
window.receiveData = function(data) {
  LOCAL_STATE = data;
  applyTheme();
  if(curTab === 'msg') renderMsgList();
};

function parentState(){return LOCAL_STATE;}
function parentChars(){return LOCAL_STATE.characters||[];}
function parentPlayer(){return LOCAL_STATE.player||{};}
function parentApi(){return LOCAL_STATE.api||{};}
function parentMvu(){return LOCAL_STATE.mvu||{};}
function parentEnableMvu(){return !!(LOCAL_STATE.settings&&LOCAL_STATE.settings.enableMVU);}
function applyTheme(){const theme=(LOCAL_STATE.settings&&LOCAL_STATE.settings.theme)||'light';document.body.className='theme-'+theme;}
function mvuCurrentDay(){const m=parentMvu();const d=(m['基础信息']&&m['基础信息']['日期'])||{};return (Number(d['年'])||3000)*360+(Number(d['月'])||1)*30+(Number(d['日'])||1);}
function mvuCharFav(n){const m=parentMvu();const f=m['好感度']||{};return Number(f[n])||0;}

document.addEventListener('click', e => {
  const target = e.target.closest('[data-action]');
  if(!target) return;
  const action = target.getAttribute('data-action');
  
  if(action === 'switch-tab') { switchTab(target.getAttribute('data-tab'), target); }
  else if(action === 'pick-story') { pickStory(target.getAttribute('data-id')); }
  else if(action === 'open-chat') { openChat(target.getAttribute('data-id')); }
  else if(action === 'set-mat-mode') { setMatMode(target.getAttribute('data-key'), target.getAttribute('data-mode')); }
  else if(action === 'del-relation') { deleteRelation(target.getAttribute('data-a'), target.getAttribute('data-b')); }
  else if(action === 'respond-invite') { respondInvite(target.getAttribute('data-id'), target.getAttribute('data-agree')==='true'); }
  else if(action === 'del-moment') { doDeleteMoment(target.getAttribute('data-id')); }
  else if(action === 'reply-moment') { momentReply(target.getAttribute('data-id')); }
  else if(action === 'cancel-meetup') { cancelMeetup(); }
  else if(action === 'open-modal') {
    const type = target.getAttribute('data-type');
    if(type === 'add-relation') addRelationDialog();
    if(type === 'post-moment') postMoment();
    if(type === 'close-modal') closeModal();
  }
  else if(action === 'submit-invite') { submitInvite(); }
  else if(action === 'submit-relation') { submitRelation(); }
  else if(action === 'submit-moment') { submitMoment(); }
  else if(action === 'submit-comment') { submitComment(target.getAttribute('data-id')); }
});

let curTab='msg';
function switchTab(tab,el){
  curTab=tab;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('p-'+tab).classList.add('active');
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  if(el)el.classList.add('active');

// 核心请求逻辑优化：支持父级代理，明确报错
async function callAI(){
  const api=parentApi();
  if(!api.endpoint||!api.key){(P.chats[curChatId]=P.chats[curChatId]||[]).push({r:'sys',c:'（尚未配置 API）',t:Date.now()});savePhone();renderChat();return;}
  const c=parentChars().find(x=>String(x.id)===String(curChatId))||{};
  const me=parentPlayer();
  const hist=(P.chats[curChatId]||[]).slice(-20).filter(m=>m.r!=='sys').map(m=>({role:m.r==='user'?'user':'assistant',content:m.c}));
  const relLines=[];
  if(P.relations[curChatId]){for(const oid in P.relations[curChatId]){const r=P.relations[curChatId][oid];if(!r.known)continue;const o=parentChars().find(x=>String(x.id)===String(oid));if(o)relLines.push(`你认识的 ${o.name}：${r.relation||'认识'}`);}}
  const sys=`你正在扮演${c.name||'角色'}，通过手机微信和用户聊天。用户名字是"${me.name||'你'}"。
性格设定：${(c.personality||c.description||'').slice(0,600)}
${relLines.length?'【你认识的人】\n'+relLines.join('\n'):''}
${P.activeMeetup?`【当前约见】你和玩家约在 ${P.activeMeetup.location}（${P.activeMeetup.daysFromNow===0?'现在':P.activeMeetup.daysFromNow+'天后'}）\n`:''}
要求：
- 只发纯文字消息，不用括号描述动作，每次 1~3 条短消息，每条不超过 30 字。
- 如果想约玩家见面，请输出 [约见邀请:${c.name||'角色'}|地点|天数(0=现在,1=1天后)]，然后不要重复描述此事。`;

  (P.chats[curChatId]=P.chats[curChatId]||[]).push({r:'sys',c:'（对方正在输入…）',t:Date.now()});
  savePhone();renderChat();

  try{
    const base=api.endpoint.replace(/\/chat\/completions\/?$/,'').replace(/\/$/,'');
    const url=base+'/chat/completions';
    const opts={
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+api.key},
      body:JSON.stringify({model:api.model||'gpt-4o-mini',messages:[{role:'system',content:sys},...hist]})
    };
    
    let res;
    // 智能判断：如果存在父页面代理服务，则走代理，彻底解决跨域
    if (window.parent && typeof window.parent.proxyFetch === 'function') {
      res = await window.parent.proxyFetch(url, opts);
    } else {
      res = await fetch(url, opts);
    }
    
    if (!res.ok) {
       let errMsg = res.status;
       try { const errData = await res.json(); errMsg = errData.error?.message || errData.message || errMsg; } catch(e){}
       throw new Error('接口报错 ' + errMsg);
    }

    const data=await res.json();
    const reply=(data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content)||'';
    const idx=P.chats[curChatId].findIndex(m=>m.r==='sys'&&m.c==='（对方正在输入…）');
    if(idx>=0)P.chats[curChatId].splice(idx,1);
    const{cleanText,invites}=extractInvites(reply,c);
    const lines=cleanText.split(/\n+/).map(s=>s.trim()).filter(Boolean);
    for(const ln of lines)P.chats[curChatId].push({r:'ai',c:ln,t:Date.now()});
    for(const inv of invites)P.pendingInvites.push(inv);
    savePhone();renderChat();
  }catch(e){
    const idx=P.chats[curChatId].findIndex(m=>m.r==='sys'&&m.c==='（对方正在输入…）');
    if(idx>=0)P.chats[curChatId].splice(idx,1);
    P.chats[curChatId].push({r:'sys',c:'（回复失败：'+(e.message||'网络异常')+'）',t:Date.now()});
    savePhone();renderChat();
  }
}

function extractInvites(text,char){
  const invites=[];const re=/\[约见邀请[:：]([^\]]+)\]/g;
  const cleanText=text.replace(re,(all,body)=>{
    const parts=body.split('|').map(s=>s.trim());
    if(parts.length>=2){const location=parts[1];const days=Number(parts[2])||0;invites.push({id:'inv_'+Date.now()+Math.random().toString(36).slice(2,6),charId:char.id,charName:char.name||parts[0],location,daysFromNow:days,from:'char',createdAt:Date.now()});}
    return '';
  }).trim();
  return{cleanText,invites};
}

function respondInvite(invId,agree){
  const idx=(P.pendingInvites||[]).findIndex(x=>x.id===invId);if(idx<0)return;
  const inv=P.pendingInvites[idx];P.pendingInvites.splice(idx,1);
  if(agree){
    P.activeMeetup={id:'meet_'+Date.now(),charId:inv.charId,charName:inv.charName,location:inv.location,daysFromNow:inv.daysFromNow,targetDay:mvuCurrentDay()+inv.daysFromNow,status:'accepted',createdAt:Date.now()};
    (P.chats[inv.charId]=P.chats[inv.charId]||[]).push({r:'sys',c:`（已接受约见：${inv.location}，${inv.daysFromNow===0?'现在':inv.daysFromNow+'天后'}）`,t:Date.now()});
    savePhone();renderChat();
    try{window.parent.onMeetupAccepted&&window.parent.onMeetupAccepted(P.activeMeetup);}catch(e){}
    toast('已接受约见，请打开地图前往约定地点');
  }else{
    (P.chats[inv.charId]=P.chats[inv.charId]||[]).push({r:'sys',c:'（你拒绝了这次约见）',t:Date.now()});
    savePhone();renderChat();
  }
}

function submitInvite(){
  const char=parentChars().find(x=>String(x.id)===String(curChatId));if(!char){closeModal();return;}
  const loc=document.getElementById('inv-loc').value;const days=Number(document.getElementById('inv-when').value)||0;
  if(!loc){toast('请选择地点');return;}
  closeModal();
  const enableMvu=parentEnableMvu();let agree=true,reason='';
  if(enableMvu){
    const fav=mvuCharFav(char.name);
    const personality=(char.personality||char.description||'');
    const cold=/冷漠|疏离|内向|冷淡|不近人情|孤僻|高傲/.test(personality);
    const warm=/热情|开朗|活泼|主动|温柔|友善|大方/.test(personality);
    let threshold=20;if(cold)threshold=60;else if(warm)threshold=10;
    if(days===0)threshold+=20;
    agree=fav>=threshold;reason=`（好感${fav}，阈值${threshold}，${cold?'冷淡':warm?'热情':'普通'}人设）`;
  }
  (P.chats[char.id]=P.chats[char.id]||[]).push({r:'user',c:`（邀请你去 ${loc}，${days===0?'现在':days+'天后'}）`,t:Date.now()});
  if(agree){
    P.activeMeetup={id:'meet_'+Date.now(),charId:char.id,charName:char.name,location:loc,daysFromNow:days,targetDay:mvuCurrentDay()+days,status:'accepted',createdAt:Date.now()};
    P.chats[char.id].push({r:'sys',c:`（对方同意了约见，${loc}，${days===0?'现在':days+'天后'}）`,t:Date.now()});
    savePhone();renderChat();
    try{window.parent.onMeetupAccepted&&window.parent.onMeetupAccepted(P.activeMeetup);}catch(e){}
    toast('约见成功，请打开地图前往约定地点');
  }else{
    P.chats[char.id].push({r:'sys',c:`（对方婉拒了这次约见）${reason}`,t:Date.now()});
    savePhone();renderChat();
  }
}

    <div class="sec"><div class="sec-title">素材库</div><div style="font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.7;">每个素材可选择「内置」或「自定义」。</div>${matHtml}</div>
    <div class="sec"><div class="sec-title">角色关系</div><div style="font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.7;">设置角色之间是否认识、什么关系。角色认识后会在朋友圈中互动。</div>${relHtml}<button class="btn" style="width:100%;margin-top:8px;" data-action="open-modal" data-type="add-relation">＋ 添加关系</button></div>
    <div class="sec"><div class="sec-title">约见</div>${meetupHtml}</div>
  `;
}

function renderRelationsHtml(){
  const chars=parentChars();const lines=[];
  for(const idA in (P.relations||{})){
    const cA=chars.find(x=>String(x.id)===String(idA));if(!cA)continue;
    for(const idB in P.relations[idA]){
      const r=P.relations[idA][idB];if(!r.known)continue;
      const cB=chars.find(x=>String(x.id)===String(idB));if(!cB)continue;
      lines.push(`<div class="rel-item"><div class="rel-head"><div class="rel-names">${escHtml(cA.name)} ↔ ${escHtml(cB.name)}</div><button class="rel-del" data-action="del-relation" data-a="${idA}" data-b="${idB}">✕</button></div><div class="rel-relation">关系：${escHtml(r.relation||'认识')}</div></div>`);
    }
  }
  return lines.length?lines.join(''):'<div class="loading">还没有设置关系</div>';
}

function setProfile(key,val){P.userProfile[key]=val;savePhone();}
function setMode(m){P.mode=m;savePhone();if(m==='ai'){try{window.parent.closePhoneOverlay&&window.parent.closePhoneOverlay();window.parent.renderMainScene&&window.parent.renderMainScene();}catch(e){}}renderMode();}
async function pickStory(id){
  const story=MANIFEST.find(s=>s.id===id);if(!story){toast('剧本未找到');return;}
  const cache=localStorage.getItem(STORY_KEY(id));
  if(!cache){
    try{const r=await fetch(story.file||('./stories/'+id+'.txt'),{cache:'no-cache'});if(!r.ok)throw new Error('HTTP '+r.status);const txt=await r.text();localStorage.setItem(STORY_KEY(id),txt);}catch(e){toast('剧本加载失败：'+e.message);return;}
  }
  P.activeStoryId=id;P.mode='story';savePhone();
  try{window.parent.startStoryById&&window.parent.startStoryById(id);window.parent.closePhoneOverlay&&window.parent.closePhoneOverlay();}catch(e){}
  renderMode();
}
function setMatMode(key,mode){if(mode==='builtin')delete P.materialOverrides[key];else if(!P.materialOverrides[key])P.materialOverrides[key]='';savePhone();renderMode();}
function onMatInput(key,val){P.materialOverrides[key]=val;savePhone();}

function addRelationDialog(){
  const chars=parentChars();if(chars.length<2){toast('至少需要 2 个角色');return;}
  const opts=chars.map(c=>`<option value="${c.id}">${escHtml(c.name)}</option>`).join('');
  openModal('添加角色关系',`<div class="field"><label>角色 A</label><select id="rel-a">${opts}</select></div><div class="field"><label>角色 B</label><select id="rel-b">${opts}</select></div><div class="field"><label>关系描述</label><input id="rel-desc" placeholder="如同班同学、青梅竹马..."></div>`,`<button class="secondary" data-action="open-modal" data-type="close-modal">取消</button><button class="primary" data-action="submit-relation">保存</button>`);
}
function submitRelation(){
  const a=document.getElementById('rel-a').value;const b=document.getElementById('rel-b').value;const desc=document.getElementById('rel-desc').value.trim();
  if(a===b){toast('角色不能相同');return;}if(!desc){toast('请填写关系');return;}
  P.relations[a]=P.relations[a]||{};P.relations[b]=P.relations[b]||{};
  P.relations[a][b]={known:true,relation:desc};P.relations[b][a]={known:true,relation:desc};
  savePhone();closeModal();renderMode();
}
function deleteRelation(a,b){if(P.relations[a])delete P.relations[a][b];if(P.relations[b])delete P.relations[b][a];savePhone();renderMode();}
function cancelMeetup(){P.activeMeetup=null;savePhone();renderMode();try{window.parent.onMeetupCancelled&&window.parent.onMeetupCancelled();}catch(e){}toast('已取消约见');}

(async function init(){
  try {
    if(window.parent && window.parent.state) {
       window.receiveData(window.parent.state);
    }
  } catch(e) {}
  await loadManifest();
  await loadBuiltinMaterials();
  renderMsgList();
})();
</script>
</body>
</html>
