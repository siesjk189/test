<style>
  /* ===== 默认值兜底（当单独打开时生效，或者被主游戏覆盖） ===== */
  :root {
    --bg: #fbf9f4; --surface: #fff; --surface-2: #faf8f3;
    --text: #1c1c1e; --muted: #8b877e; --line: rgba(28,28,30,.14);
    --accent: #1c1c1e; --radius: 8px;
    --font-family: "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "Microsoft YaHei", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151519; --surface: #1b1b20; --surface-2: #151519;
      --text: #eceae5; --muted: #807d76; --line: rgba(236,234,229,.14);
      --accent: #eceae5;
    }
  }
  
  * { box-sizing: border-box; }
  
  body { 
    margin: 0; 
    padding: 16px; 
    background: var(--bg); 
    color: var(--text); 
    font-size: 15px; 
    line-height: 1.8; 
    font-family: var(--font-family);
    -webkit-font-smoothing: antialiased; 
  }
  
  /* ===== 完美还原主游戏的 Tab 样式 ===== */
  .tabs { 
    display: flex; gap: 22px; border-bottom: 1px solid var(--line); margin: 0 0 20px; 
  }
  .tab { 
    flex: 0 0 auto; min-height: 46px; border: 0; border-bottom: 2px solid transparent; 
    background: transparent; color: var(--muted); padding: 0 2px; cursor: pointer; 
    font-family: inherit; font-size: 15px; transition: all 0.2s;
  }
  .tab.active { 
    color: var(--text); border-bottom-color: var(--text); font-weight: 600; 
  }
  
  .content { display: none; }
  .content.active { display: block; animation: fadein 0.3s; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  
  .text-block { white-space: pre-wrap; }
  
  /* ===== 更新日志块样式 ===== */
  .log-block { 
    margin-bottom: 24px; padding: 16px; background: var(--surface-2); 
    border-radius: var(--radius); border-left: 3px solid transparent; 
  }
  .log-block.latest { border-left-color: var(--accent); }
  .log-block:not(.latest) { opacity: 0.7; }
  .log-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .log-version { color: var(--text); font-size: 16px; font-weight: 600; margin: 0; }
  .log-block.latest .log-version { color: var(--accent); }
  .log-date { font-size: 12px; color: var(--muted); }
  .log-list { padding-left: 20px; margin: 0; }
  .log-list li { margin-bottom: 6px; }
</style>
</head>
<body>

<div class="tabs">
  <button class="tab active" onclick="switchTab('rules', event)">玩家须知</button>
  <button class="tab" onclick="switchTab('changelog', event)">更新日志</button>
</div>

<div id="content-rules" class="content active text-block"></div>
<div id="content-changelog" class="content"></div>

<script>
// ===== 榨取父窗口的主题变量，强行应用到当前公告 =====
function syncThemeFromParent() {
  try {
    const parentBody = window.parent.document.body;
    
    // 提取父窗口的所有核心 CSS 变量
    const computedStyle = window.parent.getComputedStyle(parentBody);
    const varsToCopy = ['--bg', '--surface', '--surface-2', '--text', '--muted', '--line', '--accent', '--glass', '--radius'];
    
    varsToCopy.forEach(v => {
      let val = computedStyle.getPropertyValue(v);
      if(val) document.documentElement.style.setProperty(v, val);
    });

    // 同步字体
    let fontVar = computedStyle.getPropertyValue('font-family');
    if(fontVar) document.documentElement.style.setProperty('--font-family', fontVar);

  } catch(e) {
    // 如果单独打开文件（没有父窗口），就会报错并进入这里，直接使用默认样式
  }
}

// 执行同步
syncThemeFromParent();

// ===== 渲染数据 =====
document.addEventListener('DOMContentLoaded', () => {
  const rulesEl = document.getElementById('data-rules');
  const changelogEl = document.getElementById('data-changelog');
  
  if (rulesEl && changelogEl) {
    // 渲染玩家须知
    document.getElementById('content-rules').textContent = rulesEl.textContent.trim();

    // 渲染更新日志
    const lines = changelogEl.textContent.trim().split('\n').map(l => l.trim()).filter(Boolean);
    let html = '';
    let isFirst = true; 
    let block = null;

    lines.forEach(line => {
      // 匹配如 【V1.1 |2026.11.12】 的格式
      const match = line.match(/^【(.*?)\|(.*?)(?:\|(最新))?】$/);
      if (match) {
        if (block) html += buildBlock(block);
        block = { version: match[1], date: match[2], isLatest: match[3] === '最新' || isFirst, items: [] };
        isFirst = false;
      } else if (block) {
        block.items.push(line);
      }
    });
    if (block) html += buildBlock(block);
    document.getElementById('content-changelog').innerHTML = html;
  }
});

function buildBlock(b) {
  return `
    <div class="log-block ${b.isLatest ? 'latest' : ''}">
      <div class="log-head">
        <h3 class="log-version">${b.version}</h3>
        <span class="log-date">${b.date}</span>
      </div>
      <ul class="log-list">
        ${b.items.map(item => `<li>${item}</li>`).join('')}
      </ul>
    </div>
  `;
}

function switchTab(id, event) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('content-' + id).classList.add('active');
}
</script>
