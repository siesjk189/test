<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,viewport-fit=cover">
<title>PNG 资源分享工坊</title>
<style>
  :root { --bg: #f5f5f7; --surface: #fff; --text: #333; --muted: #888; --line: #e0e0e0; --accent: #007aff; --success: #34c759; --danger: #ff3b30; --radius: 8px; }
  body.theme-dark { --bg: #1e1e1e; --surface: #2d2d2d; --text: #e0e0e0; --muted: #888; --line: #444; --accent: #0a84ff; --success: #30d158; --danger: #ff453a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); padding: 16px; height: 100vh; overflow-y: auto; }
  h2 { font-size: 16px; margin-bottom: 12px; border-left: 4px solid var(--accent); padding-left: 8px; }
  .section { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 20px; }
  .intro { font-size: 12px; color: var(--muted); margin-bottom: 12px; line-height: 1.6; }
  input[type="text"], input[type="file"] { width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 6px; padding: 10px; font-size: 13px; outline: none; margin-bottom: 8px;}
  .btn { width: 100%; padding: 10px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 8px; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-success { background: var(--success); color: #fff; }
  .btn-sec { background: var(--surface); border: 1px solid var(--line); color: var(--text); }
  .check-group { max-height: 150px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; padding: 8px; background: var(--bg); margin-bottom: 12px; }
  .check-item { display: flex; align-items: center; padding: 6px; font-size: 13px; border-bottom: 1px solid var(--line); }
  .check-item:last-child { border-bottom: none; }
  .check-item input { margin-right: 10px; transform: scale(1.2); }
  .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 13px; z-index: 999; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
</style>
</head>
<body class="theme-light">
  <div id="toast" class="toast"></div>

  <div class="section" style="border-color: var(--success);">
    <h2 style="border-color: var(--success);">📥 导入分享卡</h2>
    <p class="intro">选择别人发给你的 PNG 图片，读取其中的资源。</p>
    <input type="file" id="importPngFile" accept="image/png">
    <button class="btn btn-success" onclick="importPNG()">读取并导入</button>
  </div>

  <div class="section">
    <h2>📤 制作分享卡</h2>
    <p class="intro">勾选资源并上传底图（支持 JPG/PNG）。如果不传底图，系统自动生成黑色背景。</p>
    
    <input type="file" id="baseImageUpload" accept="image/jpeg, image/png">
    
    <div class="check-group" id="charList"></div>
    <div class="check-group" id="imgList"></div>
    <div class="check-group" id="bgList"></div>
    <div class="check-group" id="voiceList"></div>

    <button class="btn btn-primary" onclick="exportPNG()" style="padding:14px; font-size:15px;"> 生成并下载 PNG</button>
  </div>

<script>
  try { if (window.parent.document.body.className.includes('theme-dark')) document.body.className = 'theme-dark'; } catch(e) {}
  const PNG_KEYWORD = "dk_share_data";

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.style.opacity = '1';
    setTimeout(() => el.style.opacity = '0', 2000);
  }
  function getParentState() { try { return window.parent.eval('state'); } catch(e) { return null; } }
  function saveParentState() { try { window.parent.eval('persist(true)'); window.parent.eval('renderPanel()'); } catch(e) {} }

  window.onload = () => {
    const state = getParentState(); if (!state) return;
    
    const renderList = (containerId, arr, prefix) => {
      const box = document.getElementById(containerId);
      if(!arr || arr.length === 0) { box.innerHTML = `<div class="intro" style="padding:4px;">无自定义${prefix}</div>`; return; }
      box.innerHTML = arr.map((item, i) => `
        <label class="check-item">
          <input type="checkbox" data-type="${containerId}" data-index="${i}" data-obj='${JSON.stringify(item).replace(/'/g, "&#39;")}'>
          <span>${item.name}</span>
        </label>
      `).join('');
    };

    const chars = state.characters.filter(c => !c.builtIn || c.useCustomProfile);
    const imgs = state.images.filter(i => !i.builtIn);
    const bgs = state.backgrounds.filter(b => !b.builtIn && !b.id.startsWith('bg'));
    let voices = state.voice.customList || [];
    state.characters.forEach(c => { if(c.voiceOverride) voices.push({name: c.name + '的音色', voiceId: c.voiceOverride}); });

    renderList('charList', chars, '角色');
    renderList('imgList', imgs, '立绘');
    renderList('bgList', bgs, '背景');
    renderList('voiceList', voices, '音色');
  };

  // ================= 核心：生成并注入 PNG =================
  async function exportPNG() {
    const pack = { characters: [], images: [], backgrounds: [], voices: [] };
    
    document.querySelectorAll('input[type="checkbox"]:checked').forEach(cb => {
      const obj = JSON.parse(cb.getAttribute('data-obj'));
      if(cb.dataset.type === 'charList') pack.characters.push(obj);
      if(cb.dataset.type === 'imgList') pack.images.push(obj);
      if(cb.dataset.type === 'bgList') pack.backgrounds.push(obj);
      if(cb.dataset.type === 'voiceList') pack.voices.push(obj);
    });

    if (pack.characters.length === 0 && pack.images.length === 0 && pack.backgrounds.length === 0 && pack.voices.length === 0) {
      return toast('请至少勾选一项资源');
    }

    const btn = event.target; btn.textContent = '处理中...'; btn.disabled = true;

    try {
      const base64Data = btoa(unescape(encodeURIComponent(JSON.stringify(pack))));
      const fileInput = document.getElementById('baseImageUpload');
      
      let imgBuffer;
      if (fileInput.files && fileInput.files[0]) {
        // 1. 如果有底图，用 Canvas 转成标准 PNG 的 ArrayBuffer
        const file = fileInput.files[0];
        const dataUrl = await new Promise(res => { const r = new FileReader(); r.onload = e => res(e.target.result); r.readAsDataURL(file); });
        const img = new Image();
        img.src = dataUrl;
        await new Promise(res => img.onload = res);
        
        const canvas = document.createElement('canvas');
        canvas.width = img.width; canvas.height = img.height;
        canvas.getContext('2d').drawImage(img, 0, 0);
        const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
        imgBuffer = await blob.arrayBuffer();
      } else {
        // 2. 如果没有底图，画一张纯黑的底图
        const canvas = document.createElement('canvas');
        canvas.width = 400; canvas.height = 600;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#1e1e1e'; ctx.fillRect(0, 0, 400, 600);
        ctx.fillStyle = '#fff'; ctx.font = '20px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('DK 分享卡', 200, 300);
        const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
        imgBuffer = await blob.arrayBuffer();
      }

      // 3. 把数据写进 PNG 的 tEXt 块
      const newBuffer = injectPNGData(imgBuffer, PNG_KEYWORD, base64Data);
      
      // 4. 下载
      const finalBlob = new Blob([newBuffer], { type: 'image/png' });
      const url = URL.createObjectURL(finalBlob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `分享卡_${Date.now()}.png`;
      a.click();
      URL.revokeObjectURL(url);
      toast('生成成功！');
    } catch(e) {
      toast('生成失败：' + e.message);
    } finally {
      btn.textContent = '生成并下载 PNG'; btn.disabled = false;
    }
  }

  // ================= 核心：读取并导入 =================
  async function importPNG() {
    const file = document.getElementById('importPngFile').files[0];
    if (!file) return toast('请选择图片');
    
    try {
      const buffer = await file.arrayBuffer();
      const base64Data = extractPNGData(buffer, PNG_KEYWORD);
      if (!base64Data) throw new Error('该图片不包含资源数据');

      const pack = JSON.parse(decodeURIComponent(escape(atob(base64Data))));
      const state = getParentState();
      if (!state.custom_resources) state.custom_resources = { characters: [], images: [], backgrounds: [], voices: [] };
      const pool = state.custom_resources;
      
      let count = 0;
      const merge = (target, source) => {
        if (!source) return;
        source.forEach(item => {
          if (!target.some(x => x.name === item.name)) { target.push(item); count++; }
        });
      };

      if (pack.voices) {
        pack.voices.forEach(v => {
          if (v.bindChar) {
            const c = state.characters.find(x => x.name === v.bindChar);
            if (c) { c.voiceOverride = v.voiceId; c.useCustomVoice = true; count++; return; }
          }
          if (!pool.voices.some(x => x.name === v.name)) { pool.voices.push(v); count++; }
        });
      }

      merge(pool.characters, pack.characters);
      merge(pool.images, pack.images);
      merge(pool.backgrounds, pack.backgrounds);

      saveParentState();
      toast(`✅ 成功导入 ${count} 项资源！`);
      document.getElementById('importPngFile').value = '';
    } catch(e) {
      toast('读取失败：' + e.message);
    }
  }

  // ================= 底层：PNG 数据块读写 =================
  const crcTable = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
    crcTable[n] = c;
  }
  function crc32(buf) {
    let c = 0xffffffff;
    for (let i = 0; i < buf.length; i++) c = (c >>> 8) ^ (crcTable[(c ^ buf[i]) & 0xff]);
    return (c ^ 0xffffffff) >>> 0;
  }

  function injectPNGData(buffer, keyword, text) {
    const uint8 = new Uint8Array(buffer);
    let iendPos = uint8.length - 12;
    const enc = new TextEncoder();
    const keyBytes = enc.encode(keyword);
    const textBytes = enc.encode(text);
    const dataLen = keyBytes.length + 1 + textBytes.length;
    const chunk = new Uint8Array(12 + dataLen);
    const view = new DataView(chunk.buffer);
    view.setUint32(0, dataLen);
    chunk.set([116, 69, 88, 116], 4); // "tEXt"
    chunk.set(keyBytes, 8);
    chunk.set([0], 8 + keyBytes.length);
    chunk.set(textBytes, 8 + keyBytes.length + 1);
    const crcBuf = chunk.slice(4, 8 + dataLen);
    view.setUint32(8 + dataLen, crc32(crcBuf));
    const newBuffer = new Uint8Array(uint8.length + chunk.length);
    newBuffer.set(uint8.slice(0, iendPos), 0);
    newBuffer.set(chunk, iendPos);
    newBuffer.set(uint8.slice(iendPos), iendPos + chunk.length);
    return newBuffer.buffer;
  }

  function extractPNGData(buffer, keyword) {
    const uint8 = new Uint8Array(buffer);
    const view = new DataView(buffer);
    let pos = 8;
    const dec = new TextDecoder("utf-8");
    const keyBytes = new TextEncoder().encode(keyword);
    while (pos < uint8.length) {
      const length = view.getUint32(pos);
      const type = String.fromCharCode(...uint8.slice(pos + 4, pos + 8));
      if (type === 'tEXt') {
        const data = uint8.slice(pos + 8, pos + 8 + length);
        let isMatch = true;
        for (let i = 0; i < keyBytes.length; i++) {
          if (data[i] !== keyBytes[i]) { isMatch = false; break; }
        }
        if (isMatch && data[keyBytes.length] === 0) {
          return dec.decode(data.slice(keyBytes.length + 1));
        }
      }
      pos += 12 + length;
      if (type === 'IEND') break;
    }
    return null;
  }
</script>
</body>
</html>
