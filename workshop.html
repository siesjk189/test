<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,viewport-fit=cover">
<title>PNG 资源分享工坊</title>
<style>
  /* 默认值兜底 */
  :root { 
    --bg: #0d1118; --surface: #1b1f26; --text: #e2e8f0; --muted: #8b94a8; 
    --line: #2c3542; --accent: #4b8bf5; --success: #10b981; 
    --radius: 8px; 
    --font-family: "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "Microsoft YaHei", serif;
    --p-paper: #ffffff; --p-ink: #111111;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    font-family: var(--font-family); 
    background: var(--bg); color: var(--text); 
    padding: 16px; height: 100vh; overflow-y: auto; 
    transition: background 0.3s, color 0.3s;
  }
  
  h2 { font-size: 16px; margin-bottom: 12px; border-left: 4px solid var(--p-paper); padding-left: 8px; font-weight: 600; letter-spacing: .08em; color: var(--text); }
  .section { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 20px; transition: background 0.3s; }
  .intro { font-size: 13px; color: var(--muted); margin-bottom: 12px; line-height: 1.6; }
  
  /* 统一按钮样式，完全贴合主游戏 */
  .btn { 
    width: 100%; padding: 12px; border-radius: 3px; 
    font-size: 14px; font-weight: 500; font-family: inherit;
    cursor: pointer; margin-top: 8px; display: flex; justify-content: center; align-items: center; gap: 8px;
    transition: background 0.2s, color 0.2s, transform 0.2s, border-color 0.2s;
  }
  .btn:active { transform: translateY(1px) scale(0.98); }
  
  /* 对应主游戏的 primary-btn */
  .btn-primary { 
    background: var(--p-paper); 
    color: var(--p-ink); 
    border: 1px solid var(--p-paper); 
  }
  .btn-primary:hover { 
    background: oklch(0.85 0.02 250); 
  }

  /* 导入按钮，同样使用主游戏的风格 */
  .btn-import {
    background: var(--surface-2, #2c3542); 
    color: var(--text); 
    border: 1px solid var(--line);
  }
  .btn-import:hover { 
    border-color: var(--p-paper); 
    color: var(--p-paper);
  }
  
  /* 列表区域 */
  .check-group { max-height: 150px; overflow-y: auto; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; background: var(--bg); margin-bottom: 12px; scrollbar-width: thin; }
  .check-item { display: flex; align-items: center; padding: 8px; font-size: 14px; border-bottom: 1px dashed var(--line); color: var(--text); cursor: pointer; }
  .check-item:last-child { border-bottom: none; }
  .check-item input { margin-right: 12px; transform: scale(1.2); accent-color: var(--p-paper); cursor: pointer; }
  
  /* 上传区 */
  .upload-box { border: 2px dashed var(--line); border-radius: var(--radius); padding: 16px; text-align: center; background: var(--bg); margin-bottom: 16px; transition: border-color 0.2s; }
  .upload-box:hover { border-color: var(--p-paper); }
  .upload-box p { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  
  /* 自定义 Input 和 File */
  input[type="file"] { width: 100%; color: var(--text); font-family: inherit; font-size: 13px; }
  input[type="file"]::file-selector-button {
    padding: 6px 12px; border: 1px solid var(--line); border-radius: 3px;
    background: var(--surface); color: var(--text); cursor: pointer; margin-right: 10px;
    font-family: inherit; transition: background 0.2s;
  }
  input[type="file"]::file-selector-button:hover { background: var(--line); }

  .toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); background: var(--surface); color: var(--text); padding: 10px 20px; border-radius: 3px; font-size: 13px; z-index: 999; opacity: 0; transition: opacity 0.3s; pointer-events: none; border: 1px solid var(--line); box-shadow: 0 8px 30px rgba(0,0,0,0.2); }
</style>
</head>
<body>
  <div id="toast" class="toast"></div>

  <div class="section">
    <h2>📥 导入分享卡</h2>
    <p class="intro">选择其他玩家分享的 PNG 图片。</p>
    <input type="file" id="importPngFile" accept="image/png" style="margin-bottom:12px;">
    <button class="btn btn-import" onclick="importPNG()">读取并导入</button>
  </div>

  <div class="section">
    <h2>📤 制作分享卡</h2>
    
    <div class="upload-box">
      <p>系统将使用本地 <b>base.png</b> 作为底图。<br>如果没有该文件，请手动上传：</p>
      <input type="file" id="baseImageUpload" accept="image/jpeg, image/png">
    </div>

    <div class="check-group" id="charList"></div>
    <div class="check-group" id="imgList"></div>
    <div class="check-group" id="bgList"></div>
    <div class="check-group" id="voiceList"></div>

    <button class="btn btn-primary" onclick="exportPNG()" style="padding:14px; font-size:15px;">💾 生成并下载 PNG</button>
  </div>

<script>
  // 榨取父窗口的主题变量，强行应用到工坊
  function syncThemeFromParent() {
    try {
      const parentBody = window.parent.document.body;
      const parentRoot = window.parent.document.documentElement;
      
      // 同步主题类名
      if (parentBody.classList.contains('theme-dark')) {
        document.body.classList.add('theme-dark');
      } else {
        document.body.classList.add('theme-light');
      }

      // 提取父窗口的所有核心 CSS 变量
      const computedStyle = window.parent.getComputedStyle(parentBody);
      const varsToCopy = ['--bg', '--surface', '--surface-2', '--text', '--muted', '--line', '--accent', '--glass', '--p-ink', '--p-paper', '--radius'];
      
      varsToCopy.forEach(v => {
        let val = computedStyle.getPropertyValue(v);
        if(val) document.documentElement.style.setProperty(v, val);
      });

      // 同步字体
      let fontVar = computedStyle.getPropertyValue('font-family');
      if(fontVar) document.documentElement.style.setProperty('--font-family', fontVar);

    } catch(e) {
      console.warn("由于跨域限制，无法读取父窗口主题。", e);
    }
  }

  syncThemeFromParent();

  const PNG_KEYWORD = "dk_share_data";

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.style.opacity = '1';
    setTimeout(() => el.style.opacity = '0', 2500);
  }
  function getParentState() { try { return window.parent.eval('state'); } catch(e) { return null; } }
  function saveParentState() { try { window.parent.eval('persist(true)'); window.parent.eval('renderPanel()'); } catch(e) {} }

  window.onload = () => {
    const state = getParentState(); if (!state) return;
    
    const renderList = (containerId, arr, prefix) => {
      const box = document.getElementById(containerId);
      if(!arr || arr.length === 0) { box.innerHTML = `<div class="intro" style="padding:4px;text-align:center;">无自定义${prefix}</div>`; return; }
      box.innerHTML = arr.map((item, i) => `
        <label class="check-item">
          <input type="checkbox" data-type="${containerId}" data-index="${i}" data-obj='${JSON.stringify(item).replace(/'/g, "&#39;")}'>
          <span>${item.name}</span>
        </label>
      `).join('');
    };

    const chars = state.characters.filter(c => !c.builtIn || c.useCustomProfile);
    const imgs = state.images.filter(i => !i.builtIn);
    const bgs = state.backgrounds.filter(b => !b.builtIn && !b.id.startsWith('bg'));
    let voices = state.voice.customList || [];
    state.characters.forEach(c => { if(c.voiceOverride) voices.push({name: c.name + '的音色', voiceId: c.voiceOverride}); });

    renderList('charList', chars, '角色');
    renderList('imgList', imgs, '立绘');
    renderList('bgList', bgs, '背景');
    renderList('voiceList', voices, '音色');
  };

  // ================= 核心：生成并注入 PNG =================
  async function exportPNG() {
    const pack = { characters: [], images: [], backgrounds: [], voices: [] };
    document.querySelectorAll('input[type="checkbox"]:checked').forEach(cb => {
      const obj = JSON.parse(cb.getAttribute('data-obj'));
      if(cb.dataset.type === 'charList') pack.characters.push(obj);
      if(cb.dataset.type === 'imgList') pack.images.push(obj);
      if(cb.dataset.type === 'bgList') pack.backgrounds.push(obj);
      if(cb.dataset.type === 'voiceList') pack.voices.push(obj);
    });

    if (pack.characters.length === 0 && pack.images.length === 0 && pack.backgrounds.length === 0 && pack.voices.length === 0) {
      return toast('请至少勾选一项资源');
    }

    const btn = event.target; btn.textContent = '生成中...'; btn.disabled = true;

    try {
      const base64Data = btoa(unescape(encodeURIComponent(JSON.stringify(pack))));
      const fileInput = document.getElementById('baseImageUpload');
      
      let dataUrl = '';
      if (fileInput.files && fileInput.files[0]) {
        dataUrl = await new Promise(res => { const r = new FileReader(); r.onload = e => res(e.target.result); r.readAsDataURL(fileInput.files[0]); });
      } else {
        dataUrl = './base.png'; 
      }

      const img = new Image();
      img.src = dataUrl;
      await new Promise((res, rej) => {
        img.onload = res;
        img.onerror = () => rej(new Error('加载底图失败，请确认目录下有 base.png，或手动上传图片'));
      });
      
      const canvas = document.createElement('canvas');
      canvas.width = img.width; canvas.height = img.height;
      canvas.getContext('2d').drawImage(img, 0, 0);

      const pngBlob = await new Promise(res => canvas.toBlob(res, 'image/png'));
      const imgBuffer = await pngBlob.arrayBuffer();

      const newBuffer = injectPNGData(imgBuffer, PNG_KEYWORD, base64Data);
      const finalBlob = new Blob([newBuffer], { type: 'image/png' });
      const url = URL.createObjectURL(finalBlob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `分享卡_${Date.now()}.png`;
      a.click();
      URL.revokeObjectURL(url);
      toast('生成成功！');
    } catch(e) {
      toast('生成失败：' + e.message);
    } finally {
      btn.textContent = '💾 生成并下载 PNG'; btn.disabled = false;
    }
  }

  // ================= 核心：读取并导入 =================
  async function importPNG() {
    const file = document.getElementById('importPngFile').files[0];
    if (!file) return toast('请选择图片');
    
    try {
      const buffer = await file.arrayBuffer();
      const base64Data = extractPNGData(buffer, PNG_KEYWORD);
      if (!base64Data) throw new Error('该图片不包含资源数据');

      const pack = JSON.parse(decodeURIComponent(escape(atob(base64Data))));
      const state = getParentState();
      if (!state.custom_resources) state.custom_resources = { characters: [], images: [], backgrounds: [], voices: [] };
      const pool = state.custom_resources;
      
      let count = 0;
      const merge = (target, source) => {
        if (!source) return;
        source.forEach(item => {
          if (!target.some(x => x.name === item.name)) { target.push(item); count++; }
        });
      };

      if (pack.voices) {
        pack.voices.forEach(v => {
          if (v.bindChar) {
            const c = state.characters.find(x => x.name === v.bindChar);
            if (c) { c.voiceOverride = v.voiceId; c.useCustomVoice = true; count++; return; }
          }
          if (!pool.voices.some(x => x.name === v.name)) { pool.voices.push(v); count++; }
        });
      }

      merge(pool.characters, pack.characters);
      merge(pool.images, pack.images);
      merge(pool.backgrounds, pack.backgrounds);

      saveParentState();
      toast(`✅ 成功导入 ${count} 项资源！`);
      document.getElementById('importPngFile').value = '';
    } catch(e) {
      toast('读取失败：' + e.message);
    }
  }

  // ================= 底层：PNG 数据块读写 =================
  const crcTable = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
    crcTable[n] = c;
  }
  function crc32(buf) {
    let c = 0xffffffff;
    for (let i = 0; i < buf.length; i++) c = (c >>> 8) ^ (crcTable[(c ^ buf[i]) & 0xff]);
    return (c ^ 0xffffffff) >>> 0;
  }
  function injectPNGData(buffer, keyword, text) {
    const uint8 = new Uint8Array(buffer);
    let iendPos = uint8.length - 12;
    const enc = new TextEncoder();
    const keyBytes = enc.encode(keyword);
    const textBytes = enc.encode(text);
    const dataLen = keyBytes.length + 1 + textBytes.length;
    const chunk = new Uint8Array(12 + dataLen);
    const view = new DataView(chunk.buffer);
    view.setUint32(0, dataLen);
    chunk.set([116, 69, 88, 116], 4);
    chunk.set(keyBytes, 8);
    chunk.set([0], 8 + keyBytes.length);
    chunk.set(textBytes, 8 + keyBytes.length + 1);
    const crcBuf = chunk.slice(4, 8 + dataLen);
    view.setUint32(8 + dataLen, crc32(crcBuf));
    const newBuffer = new Uint8Array(uint8.length + chunk.length);
    newBuffer.set(uint8.slice(0, iendPos), 0);
    newBuffer.set(chunk, iendPos);
    newBuffer.set(uint8.slice(iendPos), iendPos + chunk.length);
    return newBuffer.buffer;
  }
  function extractPNGData(buffer, keyword) {
    const uint8 = new Uint8Array(buffer);
    const view = new DataView(buffer);
    let pos = 8;
    const dec = new TextDecoder("utf-8");
    const keyBytes = new TextEncoder().encode(keyword);
    while (pos < uint8.length) {
      const length = view.getUint32(pos);
      const type = String.fromCharCode(...uint8.slice(pos + 4, pos + 8));
      if (type === 'tEXt') {
        const data = uint8.slice(pos + 8, pos + 8 + length);
        let isMatch = true;
        for (let i = 0; i < keyBytes.length; i++) {
          if (data[i] !== keyBytes[i]) { isMatch = false; break; }
        }
        if (isMatch && data[keyBytes.length] === 0) {
          return dec.decode(data.slice(keyBytes.length + 1));
        }
      }
      pos += 12 + length;
      if (type === 'IEND') break;
    }
    return null;
  }
</script>
</body>
</html>
